<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="https://gingacoach.com/icona.svg">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#10231D">
<title>Ginga · Sol·licitud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@300;400;500;600;700&display=swap">
<style>
/* Pàgina de l'entrenador: acceptar o rebutjar una sol·licitud i triar com es dona d'alta. S'obre amb l'enllaç signat
   del correu d'avís (coach/solicituds.py); la decisió va al Worker i Ginga l'aplica. Font: jrodfer/ginga (web/admin/). */
:root {
  --bg: #FAFAF7; --card: #FFFFFF; --fg: #10231D; --muted: #5B6863; --line: #E3E4E1;
  --accent: #FF6A2B; --ok: #00996B; --avis: #B3261E;
  --card-glass: rgba(255,255,255,0.72);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10231D; --card: #1A2C26; --fg: #F0EDE8; --muted: #969C97; --line: #24352F;
    --accent: #FF6A2B; --ok: #2DBF8C; --avis: #FF8A80;
    --card-glass: rgba(26,44,38,0.72); color-scheme: dark;
  }
}
/* el logo, igual que al reproductor de força */
.lockup { display: block; height: auto; width: 128px; margin: 0 0 6px; }
.lockup .lk-g, .lockup .lk-t { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.lockup .lk-g { stroke: var(--accent); stroke-width: 28; }
.lockup .lk-t { stroke: #00996B; stroke-width: 24; }   /* lletres verdes: es llegeixen en clar i en fosc */
.lockup .lk-p { fill: #00996B; }   /* el punt de la G, verd */
.lockup .lk-i { fill: var(--accent); }   /* el punt de la i, taronja */
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 18px/1.55 var(--sans); }
main { max-width: 640px; margin: 0 auto; padding: env(safe-area-inset-top, 0px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px); }
header { padding: 20px 0 8px; }
.marca { font-weight: 900; font-size: 26px; color: var(--accent); letter-spacing: .02em; }
h1 { font-size: 28px; line-height: 1.2; margin: 8px 0 4px; }
h2 { font-size: 22px; margin: 0 0 6px; }
.muted { color: var(--muted); }
.card { background: var(--card-glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 16px 0; }
.pregunta { padding: 12px 0; border-top: 1px solid var(--line); }
.pregunta:first-of-type { border-top: 0; }
.pregunta p { margin: 0 0 10px; font-weight: 700; }
.sino { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sino label { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border: 2px solid var(--line);
  border-radius: 12px; font-weight: 800; cursor: pointer; }
.sino input { width: 22px; height: 22px; accent-color: var(--ok); }
.sino label:has(input:checked) { border-color: var(--ok); }
.test { padding: 14px 0; border-top: 1px solid var(--line); }
.test:first-of-type { border-top: 0; }
.test p { margin: 0 0 10px; }
.fila { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
input[type=number] { font: inherit; font-size: 24px; font-weight: 800; width: 130px; padding: 10px 12px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--card); color: var(--fg); }
.btn { appearance: none; border: 0; border-radius: 14px; font: 800 18px/1 var(--sans); padding: 16px 20px; cursor: pointer;
  background: var(--accent); color: #10231D; min-height: 56px; }
.btn.sec { background: transparent; color: var(--fg); border: 2px solid var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, input:focus-visible { outline: 3px solid var(--ok); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: center; margin-top: 10px; font-weight: 600; }
.check input { width: 22px; height: 22px; accent-color: var(--ok); }
.check.gran { align-items: flex-start; font-weight: 500; border: 2px solid var(--linia, #E3E4E1); border-radius: 12px; padding: 12px; }
.check.gran input { width: 30px; height: 30px; flex: none; margin: 0; }
.avis { color: var(--avis); font-weight: 700; }
.ok { color: var(--ok); font-weight: 800; font-size: 22px; }
.tria { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tria.u { grid-template-columns: 1fr; }
.tria label { display: flex; align-items: center; gap: 10px; min-height: 52px; border: 2px solid var(--line); border-radius: 12px;
  font-weight: 700; padding: 8px 12px; cursor: pointer; }
.tria input { width: 22px; height: 22px; accent-color: var(--ok); flex: none; }
.tria label:has(input:checked) { border-color: var(--ok); }
.dies { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dies label { flex-direction: column; justify-content: center; padding: 6px 0; gap: 4px; font-size: 15px; }
input[type=text], input[type=date] { font: inherit; font-weight: 700; width: 100%; padding: 12px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--card); color: var(--fg); }
.avis { color: var(--avis); font-weight: 700; }
.ok { color: var(--ok); font-weight: 800; font-size: 22px; }
.ajuda { color: var(--muted); font-size: 15px; margin: -4px 0 10px; font-weight: 400; }
[hidden] { display: none !important; }
.tria { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tria.u { grid-template-columns: 1fr; }
.tria label { display: flex; align-items: center; gap: 10px; min-height: 52px; border: 2px solid var(--line); border-radius: 12px;
  font-weight: 700; padding: 8px 12px; cursor: pointer; }
.tria input { width: 22px; height: 22px; accent-color: var(--ok); flex: none; }
.tria label:has(input:checked) { border-color: var(--ok); }
input[type=text], select { font: inherit; font-weight: 700; width: 100%; padding: 12px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--card); color: var(--fg); }
.dades { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; }
.dades dt { color: var(--muted); }
.dades dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.avis { color: var(--avis); font-weight: 700; }
.ok { color: var(--ok); font-weight: 800; font-size: 22px; }
.ajuda { color: var(--muted); font-size: 15px; margin: 4px 0 0; font-weight: 400; }
.decisio { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.decisio label { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; border: 2px solid var(--line);
  border-radius: 14px; font-weight: 800; font-size: 19px; cursor: pointer; }
.decisio input { width: 22px; height: 22px; accent-color: var(--ok); }
.decisio label:has(input[value=accepta]:checked) { border-color: var(--ok); }
.decisio label:has(input[value=rebutja]:checked) { border-color: var(--avis); }
</style>
<link rel="stylesheet" href="../marca.css">
</head>
<body>
<main>
  <header>
    <svg class="lockup" viewBox="-12 -16 704 208" role="img" aria-label="ginga"><path class="lk-g" d="M91.6 42.8 A46 46 0 1 0 97.2 107.6 L72 78 L114 78"/><circle class="lk-p" cx="126" cy="6" r="15"/><g class="lk-t" transform="translate(180,30)"><circle cx="50" cy="50" r="38"/><path d="M88 10 V112 A30 30 0 0 1 58 142 H28"/><path d="M136 12 V88"/><path d="M184 88 V12"/><path d="M184 50 A38 38 0 0 1 260 50 V88"/><circle cx="336" cy="50" r="38"/><path d="M374 10 V112 A30 30 0 0 1 344 142 H314"/><circle cx="450" cy="50" r="38"/><path d="M488 10 V88"/></g><circle class="lk-i" cx="316" cy="-1" r="14"/></svg>
    <h1 id="titol">Sol·licitud</h1>
    <p class="muted" style="margin:0">Acceptes o rebutges. Ginga fa la resta i t'envia un correu quan estigui fet.</p>
  </header>

  <div id="sense-enllac" class="card" hidden>
    <p style="margin:0">Aquesta pàgina s'obre amb el botó del correu d'avís de sol·licituds.</p>
  </div>

  <form id="formulari" hidden>
    <section class="card">
      <h2 id="programa"></h2>
      <dl class="dades" id="dades"></dl>
    </section>

    <section class="card">
      <h2>Què en fem?</h2>
      <div class="decisio">
        <label><input type="radio" name="accio" value="accepta"> Accepta</label>
        <label><input type="radio" name="accio" value="rebutja"> Rebutja</label>
      </div>
    </section>

    <section class="card" id="bloc-accepta" hidden>
      <p style="margin:0" id="que-passa"></p>
      <label class="check gran" style="margin-top:14px"><input type="checkbox" id="revisar" checked> Primer a mi: els
        correus que li toquin m'arriben a mi per revisar-los abans.</label>
    </section>

    <section class="card" id="bloc-rebutja" hidden>
      <h2>Rebutjar</h2>
      <label class="check gran"><input type="checkbox" id="avisa" checked> Envia-li un correu amable dient que ara mateix
        no la podem atendre.</label>
      <p class="ajuda">Les seves dades s'esborren soles al cap de 90 dies.</p>
    </section>

    <p class="avis" id="error" hidden></p>
    <button class="btn" type="submit" id="envia" style="width:100%" disabled>Desa la decisió</button>
  </form>

  <section id="fet" class="card" hidden>
    <p class="ok" style="margin:0 0 8px">Fet!</p>
    <p style="margin:0" id="fet-txt"></p>
  </section>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function llegeixHash() {
    var codi = (location.hash || "").slice(1);
    if (!codi) return null;
    try {
      var b64 = codi.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) b64 += "=";
      var bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var d = JSON.parse(new TextDecoder("utf-8").decode(bytes));
      return d && d.u && d.id && d.g && d.s ? d : null;
    } catch (err) { return null; }
  }
  var d = llegeixHash();
  if (!d) { $("sense-enllac").hidden = false; return; }
  var s = d.s, forca = s.programa === "forca";
  $("formulari").hidden = false;
  $("titol").textContent = "Sol·licitud de " + (s.nom || "?");
  $("programa").textContent = forca ? "Ginga Força" : "Ginga";
  var EDATS = { "18-39": "18 a 39", "40-49": "40 a 49", "50-59": "50 a 59", "60+": "60 o més" };
  [["Nom", s.nom], ["Correu", s.email], ["Edat", EDATS[s.edat] || s.edat], ["Objectiu", s.objectiu],
   ["intervals.icu", s.intervals ? (s.intervals === "si" ? "sí" : "no") + (s.intervals_id ? " (" + s.intervals_id + ")" : "") : null],
   ["Ens ha conegut", s.com], ["Enviada", (s.ts || "").slice(0, 16).replace("T", " ")]].forEach(function (x) {
    if (!x[1]) return;
    var dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = x[0]; dd.textContent = x[1];
    $("dades").appendChild(dt); $("dades").appendChild(dd);
  });
  $("que-passa").textContent = forca
    ? "Li enviarem la benvinguda amb el formulari d'inici: hi dirà quins dies li van bé, quin material té i com es mou. El pla comença el dilluns després que el respongui."
    : "Li enviarem els passos per obrir intervals.icu i acceptar-te com a entrenador. El pla de Ginga el prepares després.";
  function valor(nom) { var x = document.querySelector("input[name='" + nom + "']:checked"); return x ? x.value : null; }
  document.querySelectorAll("input[name=accio]").forEach(function (r) {
    r.addEventListener("change", function () {
      $("bloc-accepta").hidden = valor("accio") !== "accepta";
      $("bloc-rebutja").hidden = valor("accio") !== "rebutja";
      $("envia").disabled = false;
      $("envia").textContent = valor("accio") === "accepta" ? "Dona-la d'alta" : "Rebutja-la";
    });
  });
  $("formulari").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var accio = valor("accio");
    var params = accio === "accepta" ? { revisar: $("revisar").checked } : { avisa: $("avisa").checked };
    $("error").hidden = true; $("envia").disabled = true; $("envia").textContent = "Desant…";
    fetch(d.u, { method: "POST", headers: { "content-type": "application/json" },
                 body: JSON.stringify({ id: d.id, g: d.g, accio: accio, params: params }) })
      .then(function (r) { return r.json().then(function (j) { return { st: r.status, j: j }; }); })
      .then(function (x) {
        if (x.st === 409) throw new Error("Aquesta sol·licitud ja estava decidida i feta.");
        if (x.st === 404) throw new Error("Aquesta sol·licitud ja no hi és (caduca als 90 dies).");
        if (x.st !== 200) throw new Error("No s'ha pogut desar (" + (x.j.error || x.st) + ").");
        $("formulari").hidden = true; $("fet").hidden = false;
        $("fet-txt").textContent = (accio === "accepta" ? "Desat: la donem d'alta. " : "Desat: la rebutgem. ")
          + (x.j.ara ? "Ginga ja s'hi ha posat: en uns minuts t'arriba un correu amb el que s'ha fet."
                     : "Ginga ho farà a la propera passada (com a molt, en una hora) i t'enviarà un correu.");
        window.scrollTo(0, 0);
      })
      .catch(function (err) {
        $("envia").disabled = false; $("envia").textContent = accio === "accepta" ? "Dona-la d'alta" : "Rebutja-la";
        $("error").hidden = false; $("error").textContent = err.message.indexOf("fetch") >= 0 ? "No s'ha pogut enviar. Torna-ho a provar." : err.message;
      });
  });
})();
</script>
</body>
</html>
