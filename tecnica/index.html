<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="https://gingacoach.com/icona.svg">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#10231D">
<title>Ginga Tècnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@300;400;500;600;700&display=swap">
<style>
/* Els exercicis de tècnica de crol amb el seu vídeo. Amb #id1,id2... (l'enllaç del correu del diumenge), primer els
   d'aquella natació, en ordre; sense, el manual sencer per nivells. Amb ?m=carrera, els de tècnica de carrera
   (carrera.json, de python -m tecnica_carrera web), per blocs: la mateixa pàgina per a qualsevol mòdul de vídeos. Les dades són a exercicis.json, que es fa des de
   tecnica_natacio/exercicis.yaml (python -m tecnica_natacio web). Mateixa identitat que el reproductor de força. */
:root {
  --bg: #FAFAF7; --card: #FFFFFF; --fg: #10231D; --muted: #5B6863; --line: #E3E4E1;
  --accent: #FF6A2B; --accent-fg: #10231D; --ok: #00996B; --tag: #FFE4D3;
  --card-glass: rgba(255,255,255,0.72);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10231D; --card: #1A2C26; --fg: #F0EDE8; --muted: #969C97; --line: #24352F;
    --accent: #FF6A2B; --accent-fg: #10231D; --ok: #2DBF8C; --tag: #1D3A31;
    --card-glass: rgba(26,44,38,0.72); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10231D; --card: #1A2C26; --fg: #F0EDE8; --muted: #969C97; --line: #24352F;
  --accent: #FF6A2B; --accent-fg: #10231D; --ok: #2DBF8C; --tag: #1D3A31;
  --card-glass: rgba(26,44,38,0.72); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 16px/1.45 var(--display);
  padding: env(safe-area-inset-top, 0px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
}
main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; padding-block: 16px; }
main > *, .llista > *, .card > * { min-width: 0; }   /* la miniatura (480 px) no ha d'eixamplar la graella al mòbil */
img { max-width: 100%; }
[hidden] { display: none !important; }
h1, h2, h3 { letter-spacing: -.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; line-height: 1.1; font-weight: 900; }
h2 { font-size: 1.25rem; line-height: 1.2; font-weight: 800; margin-top: 8px; }
h3 { font-size: 1.1rem; line-height: 1.25; font-weight: 800; }
p { margin: 0; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.cap { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lockup { display: block; height: auto; width: 116px; }
.lockup .lk-g, .lockup .lk-t { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.lockup .lk-g { stroke: var(--accent); stroke-width: 28; }
.lockup .lk-t { stroke: #00996B; stroke-width: 24; }   /* lletres verdes: es llegeixen en clar i en fosc */
.lockup .lk-p { fill: #00996B; }   /* el punt de la G, verd */
.lockup .lk-i { fill: var(--accent); }   /* el punt de la i, taronja */
.llista { display: grid; gap: 12px; }
.card { background: var(--card-glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.titol { display: flex; gap: 10px; align-items: baseline; }
.num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-fg);
  font-weight: 900; display: grid; place-items: center; font-size: .95rem; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: var(--tag); border-radius: 999px; padding: 2px 10px; font-size: .8rem; font-weight: 700; }
.idea { margin: 0; padding: 8px 12px; border-left: 4px solid var(--accent); background: var(--tag); border-radius: 0 10px 10px 0; }
.idea b { display: block; font-size: .8rem; }
.video { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000;
  border: 0; padding: 0; cursor: pointer; display: block; }
.video img { width: 100%; height: 100%; object-fit: cover; opacity: .85; display: block; }
.video .play { position: absolute; inset: 0; margin: auto; width: 64px; height: 64px; border-radius: 50%;
  background: var(--accent); display: grid; place-items: center; }
.video .play::after { content: ""; border-left: 20px solid var(--accent-fg); border-top: 12px solid transparent;
  border-bottom: 12px solid transparent; margin-left: 5px; }
.video iframe { width: 100%; height: 100%; border: 0; display: block; }
.peu { font-size: .85rem; }
a { color: inherit; }
</style>
<link rel="stylesheet" href="../marca.css">
</head>
<body>
<main>
  <header class="cap">
    <svg class="lockup" viewBox="-12 -16 704 208" role="img" aria-label="ginga"><path class="lk-g" d="M91.6 42.8 A46 46 0 1 0 97.2 107.6 L72 78 L114 78"/><circle class="lk-p" cx="126" cy="6" r="15"/><g class="lk-t" transform="translate(180,30)"><circle cx="50" cy="50" r="38"/><path d="M88 10 V112 A30 30 0 0 1 58 142 H28"/><path d="M136 12 V88"/><path d="M184 88 V12"/><path d="M184 50 A38 38 0 0 1 260 50 V88"/><circle cx="336" cy="50" r="38"/><path d="M374 10 V112 A30 30 0 0 1 344 142 H314"/><circle cx="450" cy="50" r="38"/><path d="M488 10 V88"/></g><circle class="lk-i" cx="316" cy="-1" r="14"/></svg>
    <span class="eyebrow" id="marca">Tècnica de natació</span>
  </header>

  <section id="avui" hidden>
    <div class="eyebrow" id="avui-eyebrow"></div>
    <h1 id="avui-titol"></h1>
    <p class="muted" id="avui-intro" style="margin:8px 0 12px"></p>
    <div class="llista" id="avui-llista"></div>
  </section>

  <section id="manual">
    <h1 id="manual-titol"></h1>
    <p class="muted" id="manual-intro" style="margin:8px 0 4px"></p>
    <div id="nivells"></div>
  </section>

  <p class="muted" id="error" hidden></p>
  <p class="muted peu" id="peu"></p>
</main>
<script>
(function () {
  "use strict";
  var en = new URLSearchParams(location.search).get("l") === "en";
  var T = en ? {
    marca: "Swim technique", eyebrow: "Your swim", avui: "Today's technique drills",
    avuiIntro: "One drill per technique length, in this order (usually 50 m each), and the last 10 m of each length, full stroke thinking of the idea. Easy: it's for learning, not for getting tired.",
    manual: "Freestyle technique drills", manualIntro: "Each Sunday's email tells you which ones to do. Do the drill and, for the last 10 m, swim full stroke thinking only of the idea. Watch the video before you go to the pool.",
    tots: "All the drills",
    nivells: { 1: "Level 1 · Breathing, body position and the parts of the stroke", 2: "Level 2 · Rotation and catching the water", 3: "Level 3 · Stability and sighting" },
    focus: { "respiració": "breathing", "posició": "body position", "coordinació": "timing", "rotació": "rotation", "tracció": "catch and pull", "recobrament": "recovery", "patada": "kick" },
    perA: "What it's for: ", idea: "Last 10 m, full stroke:",
    video: "Play the video", error: "The drills couldn't be loaded. Try again in a while.",
    peu: "Videos on YouTube: TriDot (Swim Drill Series) and RSB Training (Éducatif natation technique crawl)."
  } : {
    marca: "Tècnica de natació", eyebrow: "La teva natació", avui: "Els exercicis de tècnica d'avui",
    avuiIntro: "Un exercici a cada tram de tècnica, en aquest ordre (normalment 50 m cada un), i els últims 10 m de cada tram, crol complet pensant en la idea. Suau: és per aprendre, no per cansar-se.",
    manual: "Exercicis de tècnica de crol", manualIntro: "El correu de cada diumenge et diu quins toquen. Fes l'exercici i, els últims 10 m, crol complet pensant només en la idea. Mira el vídeo abans d'anar a la piscina.",
    tots: "Tots els exercicis",
    nivells: { 1: "Nivell 1 · Respiració, posició i les parts de la braçada", 2: "Nivell 2 · Girar i agafar l'aigua", 3: "Nivell 3 · Estabilitat i orientar-se" },
    focus: null,
    perA: "Per a què serveix: ", idea: "Els últims 10 m, crol complet:",
    video: "Mira el vídeo", error: "No s'han pogut carregar els exercicis. Torna-ho a provar d'aquí a una estona.",
    peu: "Vídeos a YouTube: TriDot (Swim Drill Series) i RSB Training (Éducatif natation technique crawl)."
  };
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function video(id, nom, inici) {
    var b = el("button", "video");
    b.type = "button";
    b.setAttribute("aria-label", T.video + ": " + nom);
    var img = el("img");
    img.src = "https://i.ytimg.com/vi/" + encodeURIComponent(id) + "/hqdefault.jpg";
    img.alt = ""; img.loading = "lazy";
    b.appendChild(img); b.appendChild(el("span", "play"));
    b.addEventListener("click", function () {
      var f = document.createElement("iframe");
      f.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id) + "?autoplay=1&rel=0&playsinline=1" + (inici ? "&start=" + Number(inici) : "");
      f.title = nom;
      f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
      f.allowFullscreen = true;
      var w = el("div", "video");
      w.appendChild(f);
      b.replaceWith(w);
    });
    return b;
  }
  function targeta(e, n) {
    var c = el("article", "card");
    var t = el("div", "titol");
    if (n) t.appendChild(el("span", "num", String(n)));
    t.appendChild(el("h3", null, en ? e.nom_en : e.nom));
    c.appendChild(t);
    var tags = el("div", "tags");
    if (e.focus) tags.appendChild(el("span", "tag", T.focus ? (T.focus[e.focus] || e.focus) : e.focus));
    if (e.series) tags.appendChild(el("span", "tag", e.series + " × " + e.segons + " s" + (e.costat ? " " + T.perCostat : "")));
    if (e.material && !en) tags.appendChild(el("span", "tag", e.material));
    c.appendChild(tags);
    if (e.per_a) {
      var per = el("p", "per");
      per.appendChild(el("b", null, T.perA));
      per.appendChild(document.createTextNode(en ? e.per_a_en : e.per_a));
      c.appendChild(per);
    }
    c.appendChild(el("p", null, en ? (e.detall_en || e.detall) : e.detall));
    if (e.idea) {
      var idea = el("p", "idea");
      idea.appendChild(el("b", null, T.idea));
      idea.appendChild(document.createTextNode(en ? e.idea_en : e.idea));
      c.appendChild(idea);
    }
    c.appendChild(video(e.video, en ? e.nom_en : e.nom, e.inici));
    return c;
  }
  document.documentElement.lang = en ? "en" : "ca";
  $("marca").textContent = T.marca;
  $("peu").textContent = T.peu;
  // ?m=carrera (o un altre mòdul): les seves dades (<m>.json, amb els textos i els grups); sense, la natació de sempre
  var m = new URLSearchParams(location.search).get("m");
  fetch(/^[a-z]+$/.test(m || "") ? m + ".json" : "exercicis.json").then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function (dades) {
    var grups = null;
    if (!Array.isArray(dades)) {
      var t = dades.textos[en ? "en" : "ca"];
      Object.keys(t).forEach(function (k) { T[k] = t[k]; });
      T.focus = null;
      $("marca").textContent = T.marca; $("peu").textContent = T.peu;
      grups = dades.grups;
      dades = dades.exercicis;
    }
    var perId = {};
    dades.forEach(function (e) { perId[e.id] = e; });
    var ids = decodeURIComponent(location.hash.slice(1)).split(",").filter(function (i) { return perId[i]; }).slice(0, 12);
    if (ids.length) {
      $("avui").hidden = false;
      $("avui-eyebrow").textContent = T.eyebrow;
      $("avui-titol").textContent = T.avui;
      $("avui-intro").textContent = T.avuiIntro;
      ids.forEach(function (i, n) { $("avui-llista").appendChild(targeta(perId[i], n + 1)); });
      $("manual-titol").replaceWith(el("h2", null, T.tots));
      $("manual-intro").hidden = true;
    } else {
      $("manual-titol").textContent = T.manual;
      $("manual-intro").textContent = T.manualIntro;
    }
    if (grups) grups.forEach(function (g) {          // un mòdul amb grups (els blocs de carrera): cadascun sencer
      $("nivells").appendChild(el("h2", null, (en ? g.titol_en : g.titol) + (g.minuts ? " · " + g.minuts + " min" : "")));
      var l = el("div", "llista");
      l.style.marginTop = "10px";
      g.ids.forEach(function (i, n) { if (perId[i]) l.appendChild(targeta(perId[i], n + 1)); });
      $("nivells").appendChild(l);
    });
    else [1, 2, 3].forEach(function (nivell) {
      var d = dades.filter(function (e) { return e.nivell === nivell; });
      if (!d.length) return;
      $("nivells").appendChild(el("h2", null, T.nivells[nivell]));
      var l = el("div", "llista");
      l.style.marginTop = "10px";
      d.forEach(function (e) { l.appendChild(targeta(e)); });
      $("nivells").appendChild(l);
    });
  }).catch(function () {
    $("error").hidden = false;
    $("error").textContent = T.error;
  });
})();
</script>
</body>
</html>
