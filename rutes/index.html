<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="https://gingacoach.com/icona.svg">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#10231D">
<title>Ginga Rutes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Una columna de mòbil: la sessió, d'on surts (cerca o mapa), i les propostes amb el GPX. En seguir una ruta,
   la pantalla és tota per al mapa i la pròxima indicació. Mateixa identitat que el reproductor de força. */
:root {
  --bg: #FAFAF7; --card: #FFFFFF; --fg: #10231D; --muted: #5B6863; --line: #E3E4E1;
  --accent: #FF6A2B; --accent-fg: #10231D; --ok: #00996B; --warn: #D9541C; --warn-soft: #FFE4D3;
  --ruta: #FF6A2B; --ruta-alt: #8A968F; --pujada: #00996B; --gent: #6B4FD8;
  --card-glass: rgba(255,255,255,0.72);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10231D; --card: #1A2C26; --fg: #F0EDE8; --muted: #969C97; --line: #24352F;
    --accent: #FF6A2B; --accent-fg: #10231D; --ok: #2DBF8C; --warn: #FFC531; --warn-soft: #1D3A31;
    --ruta: #FF6A2B; --ruta-alt: #A6B4AC; --pujada: #2DBF8C; --gent: #B7A6FF;
    --card-glass: rgba(26,44,38,0.72); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10231D; --card: #1A2C26; --fg: #F0EDE8; --muted: #969C97; --line: #24352F;
  --accent: #FF6A2B; --accent-fg: #10231D; --ok: #2DBF8C; --warn: #FFC531; --warn-soft: #1D3A31;
  --ruta: #FF6A2B; --ruta-alt: #A6B4AC; --pujada: #2DBF8C; --gent: #B7A6FF;
  --card-glass: rgba(26,44,38,0.72); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 16px/1.45 var(--display);
  padding: env(safe-area-inset-top, 0px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; padding-block: 16px; }
[hidden] { display: none !important; }
h1, h2 { letter-spacing: -.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; line-height: 1.1; font-weight: 900; }
h2 { font-size: 1.2rem; line-height: 1.2; font-weight: 800; }
p { margin: 0; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
/* el logo, igual que al reproductor de força */
.cap { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lockup { display: block; height: auto; }
.lockup .lk-g, .lockup .lk-t { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.lockup .lk-g { stroke: var(--accent); stroke-width: 28; }
.lockup .lk-t { stroke: #00996B; stroke-width: 24; }   /* lletres verdes: es llegeixen en clar i en fosc */
.lockup .lk-p { fill: #00996B; }   /* el punt de la G, verd */
.lockup .lk-i { fill: var(--accent); }   /* el punt de la i, taronja */
.cap .lockup { width: 116px; }
.cap .eyebrow { margin: 0; }
/* Garmin, a dalt a la dreta: «Connecta Garmin», o de qui és el que hi ha connectat */
.garmin-boto { appearance: none; font: 800 .8rem/1 var(--display); padding: 9px 12px; border-radius: 99px; cursor: pointer;
  border: 1.5px solid var(--line); background: transparent; color: var(--fg); white-space: nowrap; max-width: 200px;
  overflow: hidden; text-overflow: ellipsis; }
.garmin-boto.connectat { border-color: var(--ok); color: var(--ok); }
#segueix .lockup { width: 72px; }
.card { background: var(--card-glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.avis { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
.xifres { display: flex; flex-wrap: wrap; gap: 6px 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
.xifres span { white-space: nowrap; }

.btn { appearance: none; border: 0; border-radius: 14px; font: 800 1rem/1 var(--display); letter-spacing: .04em;
  text-transform: uppercase; padding: 16px; width: 100%; cursor: pointer; background: var(--accent); color: var(--accent-fg);
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
.btn.sec { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn.petit { padding: 12px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--ok); outline-offset: 2px; }
.fila { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tipus-bici { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
/* ruta a mida */
.tria { display: flex; gap: 8px; }
.tria .btn { flex: 1; min-width: 0; }
.camp { display: grid; gap: 6px; font-weight: 700; font-size: .92rem; }
.rang { display: flex; align-items: center; gap: 6px; }
.rang input { width: 100%; min-width: 0; font: 700 1rem var(--display); padding: 10px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); }
ol.punts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ol.punts li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; font-size: .92rem; }
ol.punts .nom { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ol.punts select { font: 700 .85rem var(--display); padding: 6px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--fg); }
ol.punts .treu { all: unset; cursor: pointer; padding: 4px 8px; font-weight: 900; color: var(--muted); }
.marca-punt { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 .8rem/1 var(--sans);
  color: #fff; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1.5px rgba(0,0,0,.3); }
.marca-punt.sortida { background: #00996B; }
.marca-punt.arribada { background: #10231D; }

form.cerca { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
input[type=search] { font: 600 1rem var(--display); padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--fg); min-width: 0; }
form.cerca .btn { width: auto; padding-inline: 16px; }
ul.llocs { list-style: none; margin: 0; padding: 0; display: grid; }
ul.llocs button { all: unset; cursor: pointer; display: block; padding: 10px 0; border-top: 1px solid var(--line); font-size: .95rem; }
ul.llocs li:first-child button { border-top: 0; }

#mapa { height: 340px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); z-index: 0; }
.leaflet-container { font-family: var(--sans); background: var(--line); }

.proposta { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
.proposta:first-child { border-top: 0; padding-top: 0; }
.proposta.triada h2 { color: var(--accent); }
.proposta .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.proposta .cap button { all: unset; cursor: pointer; font-weight: 800; color: var(--muted); font-size: .9rem; }
.llegenda { font-size: .9rem; color: var(--muted); }
.llegenda i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; background: var(--gent); vertical-align: middle; margin-right: 6px; }
.etiqueta { display: inline-block; font-size: .78rem; font-weight: 800; padding: 2px 8px; border-radius: 99px;
  background: var(--warn-soft); color: var(--fg); }

details summary { cursor: pointer; font-weight: 700; }
details[open] summary { margin-bottom: 8px; }
details ul { margin: 0; padding-left: 20px; color: var(--muted); display: grid; gap: 6px; }
details ol { margin: 6px 0; padding-left: 20px; display: grid; gap: 4px; }
/* el registre de la cerca: per copiar-lo i enviar-lo quan una ruta no surt bé */
#registre { margin-top: 12px; }
#informe-estat { margin-top: 8px; }
#registre .fila { margin: 8px 0; }
#reg-text { margin: 0; max-height: 50vh; overflow: auto; padding: 8px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre-wrap; overflow-wrap: anywhere; }

/* seguiment: pantalla completa */
#segueix { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: grid; grid-template-rows: auto 1fr auto; }
#segueix .dalt { padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; display: grid; gap: 4px; background: var(--card);
  border-bottom: 1px solid var(--line); }
#segueix .gir { font-size: 1.5rem; font-weight: 900; line-height: 1.15; }
#segueix .falta { font-size: 2.4rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
#segueix .fora { background: var(--warn); color: var(--accent-fg); font-weight: 800; padding: 8px 12px; border-radius: 10px; }
#mapa-segueix { min-height: 0; }
#segueix .baix { padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); display: grid; gap: 10px; background: var(--card);
  border-top: 1px solid var(--line); }
#segueix .estat { display: flex; justify-content: space-between; font-weight: 800; font-variant-numeric: tabular-nums; }
.jo { width: 18px; height: 18px; border-radius: 50%; background: #2F7DE1; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.25); }
</style>
<link rel="stylesheet" href="../marca.css">
</head>
<body>
<main id="app">
  <header class="cap">
    <svg class="lockup" viewBox="-12 -16 704 208" role="img" aria-label="ginga"><path class="lk-g" d="M91.6 42.8 A46 46 0 1 0 97.2 107.6 L72 78 L114 78"/><circle class="lk-p" cx="126" cy="6" r="15"/><g class="lk-t" transform="translate(180,30)"><circle cx="50" cy="50" r="38"/><path d="M88 10 V112 A30 30 0 0 1 58 142 H28"/><path d="M136 12 V88"/><path d="M184 88 V12"/><path d="M184 50 A38 38 0 0 1 260 50 V88"/><circle cx="336" cy="50" r="38"/><path d="M374 10 V112 A30 30 0 0 1 344 142 H314"/><circle cx="450" cy="50" r="38"/><path d="M488 10 V88"/></g><circle class="lk-i" cx="316" cy="-1" r="14"/></svg>

    <button class="garmin-boto" type="button" id="b-garmin" hidden></button>

    <div class="eyebrow" id="quan"></div>

  <section class="card" id="error" hidden><p id="error-text"></p></section>

  <section class="card" id="sessio" hidden>

  <section class="card" id="oberta" hidden>

      <div class="camp"><span id="o-t-km"></span><span class="rang"><input type="number" id="o-km0" inputmode="decimal" min="1" max="200" step="0.5">–<input type="number" id="o-km1" inputmode="decimal" min="1" max="200" step="0.5"></span></div>

</main>

<section id="segueix" hidden>
  <div class="dalt">
    <svg class="lockup" viewBox="-12 -16 704 208" role="img" aria-label="ginga"><path class="lk-g" d="M91.6 42.8 A46 46 0 1 0 97.2 107.6 L72 78 L114 78"/><circle class="lk-p" cx="126" cy="6" r="15"/><g class="lk-t" transform="translate(180,30)"><circle cx="50" cy="50" r="38"/><path d="M88 10 V112 A30 30 0 0 1 58 142 H28"/><path d="M136 12 V88"/><path d="M184 88 V12"/><path d="M184 50 A38 38 0 0 1 260 50 V88"/><circle cx="336" cy="50" r="38"/><path d="M374 10 V112 A30 30 0 0 1 344 142 H314"/><circle cx="450" cy="50" r="38"/><path d="M488 10 V88"/></g><circle class="lk-i" cx="316" cy="-1" r="14"/></svg>
    <div class="falta" id="s-falta"></div>

<script>
"use strict";
// ---------- configuració ----------
const PROXY = "https://ginga-rutes.jrodeja96.workers.dev/";   // el Worker de rutes (worker/README.md); buit = només pistes
const TESSELES = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const ATRIBUCIO = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · ' +
  '<a href="https://openrouteservice.org/">openrouteservice</a> · <a href="https://brouter.de/">BRouter</a> · ' +
  '<a href="https://www.openstreetmap.org/fixthemap">Informa d\'un error</a>';
// les rutes fetes i la ruta a mida: només BRouter
const ATRIBUCIO_BROUTER = ATRIBUCIO.replace('<a href="https://openrouteservice.org/">openrouteservice</a> · ', "");
const NOMINATIM = "https://nominatim.openstreetmap.org/search";
// Els servidors públics d'Overpass sovint van saturats (504): es proven per ordre, cadascun amb un temps màxim.
const OVERPASS = ["https://overpass-api.de/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
  "https://overpass.private.coffee/api/interpreter"];
const OVERPASS_SEGONS = 12;
const GENT_SEGONS = 10;         // per on va la gent: el que s'espera Overpass; si no arriba, els circuits surten igual
const GENT_MARGE = 1000;        // m de més en el radi, perquè moure una mica la sortida no torni a demanar res
const GENT_DIES = 60;           // dies que es guarden al mòbil (les rutes senyalitzades canvien poc)

async function overpass(consulta, segons = OVERPASS_SEGONS) {
  for (const url of OVERPASS) {
    try {
      const r = await fetch(url, { method: "POST", body: "data=" + encodeURIComponent(consulta),
        signal: AbortSignal.timeout ? AbortSignal.timeout(segons * 1000) : undefined });
      if (r.ok) return await r.json();
    } catch (e) { /* el següent */ }
  }
  throw new Error("overpass");
}
// openrouteservice no clava la llargada, i demanar-la ajustada canvia el circuit sencer (no corregeix res).
// Mesurat des de Figueres (15/10/2026): a peu surt d'un 0,8 a un 1,35 del que es demana; en bici de carretera,
// d'un 1,0 a un 1,65. Per això es demana una mica menys (FACTOR) amb moltes llavors de cop, i es tria.
const LLAVORS = 6;              // circuits que es demanen de cop; se n'ensenyen els 3 millors
const FACTOR = { run: 0.9, ride: 0.75 };
const MAX_ERR_KM = 0.3;         // cap proposta a més d'un 30% dels km de la sessió (36 km: de 25 a 47)
const REPARACIONS = 2;          // passades per deixar un circuit de bici de carretera 100% per carretera
const PASSADES_TRANSIT = 3;     // i passades més per treure'n els trams llargs per carretera principal
const ESGLAO_MS = 700;          // entre reparacions que comencen alhora
const BROUTER = "https://brouter.de/brouter";   // quan openrouteservice no en dona cap (perPobles)
const BROUTER_N = 6;            // recorreguts per pobles que es demanen
const BROUTER_ESGLAO_MS = 300;  // entre l'un i l'altre: el servidor de BRouter és gratuït i de tothom
const BROUTER_SEGONS = 30;
const POBLES_SEGONS = 10;
const MAX_EVITA = 80;           // el màxim de punts a evitar que accepta el proxy
const RESERVA_PRINCIPALS = 20;  // els que no gasta mai la terra: per a les principals (8 km, un punt cada 400 m)
const MARGE_KM = 0.15;          // si cap no s'hi acosta tant, una segona tanda amb la llargada ajustada

// ---------- registre ----------
// El que fa la cerca (cada petició, quant triga, què en surt i per què es descarta), perquè l'atleta el pugui copiar
// i enviar a l'entrenador quan una ruta no surt bé (en Joan, 30/10/2026). Res que identifiqui l'atleta: ni el codi ni
// la signatura de l'enllaç, ni el pseudònim, ni el que s'escriu al cercador; les coordenades, arrodonides a 0,01°
// (~1 km). Només a la memòria de la pàgina: es perd en tancar-la i no s'envia enlloc sol.
const REGISTRE_MAX = 600;       // línies; després es van perdent les més velles (la capçalera es queda)
const registre = [];
const registreT0 = performance.now();
let capRegistre = 0;            // línies de capçalera, que no es perden mai

/** Una línia al registre: segons des que s'ha obert la pàgina i el que ha passat. */
function reg(...parts) {
  const s = ((performance.now() - registreT0) / 1000).toFixed(1);
  const text = parts.map((x) => typeof x === "string" ? x : JSON.stringify(x)).join(" ");
  registre.push(`${s}s ${amaga(text)}`);
  if (registre.length > REGISTRE_MAX) registre.splice(capRegistre, registre.length - REGISTRE_MAX);
  pintaRegistre();
}
/** Les coordenades que hi pugui haver en un text (un error d'openrouteservice en porta), a 0,01°. */
const amaga = (text) => text.replace(/-?\d{1,3}\.\d{4,}/g, (x) => Number(x).toFixed(2));
const aprox = (p) => (p ? `${p[1].toFixed(2)},${p[0].toFixed(2)}` : "-");
const kms = (llista) => llista.map((c) => `${c.r.km.toFixed(1)}km(p${c.pena.toFixed(2)}${c.r.gent != null ? ` g${Math.round(c.r.gent * 100)}%` : ""}${c.r.foraCarretera ? ` fora${Math.round(c.r.foraCarretera)}m` : ""}${c.r.voltes && c.r.voltes.length ? " voltes" : ""})`).join(" ");

function pintaRegistre() {
  const pre = document.getElementById("reg-text");
  if (pre && document.getElementById("registre").open) pre.textContent = registre.join("\n");
}

/** Què és una petició, sense res de l'atleta: el servei i el que demana. */
function quePeticio(url, opts) {
  const u = String(url);
  let cos = null;
  try { cos = opts && typeof opts.body === "string" && opts.body.startsWith("{") ? JSON.parse(opts.body) : null; } catch (e) {}
  if (PROXY && u.startsWith(PROXY)) {
    if (u !== PROXY) return `proxy ${u.slice(PROXY.length).split("?")[0]}`;
    if (!cos) return "proxy";
    if (cos.cerca) return "proxy tiquet";
    if (cos.informe) return "proxy informe";
    if (cos.garmin) return `proxy garmin ${cos.garmin}`;
    if (cos.brouter) return `proxy brouter perfil=${cos.brouter.perfil} alt=${cos.brouter.alt} punts=${(cos.brouter.punts || []).length}`;
    return `proxy ors perfil=${cos.perfil} llavor=${cos.seed} factor=${Number(cos.factor || 1).toFixed(2)} via=${(cos.via || []).length} evita=${(cos.evita || []).length}`;
  }
  let host = u, cami = "";
  try { const x = new URL(u, location.href); host = x.host; cami = x.pathname; } catch (e) {}
  if (/brouter/.test(host)) {
    if (cami.endsWith("/profile")) return "brouter puja el perfil";
    const q = new URL(u).searchParams;
    return `brouter perfil=${q.get("profile")} punts=${(q.get("lonlats") || "").split("|").length}`;
  }
  if (/overpass|maps\.mail\.ru/.test(host)) {
    const b = decodeURIComponent(String(opts && opts.body || ""));
    return `overpass ${host} ${/out ids geom/.test(b) ? "gent" : /athletics|track/.test(b) ? "pistes" : "pobles"}`;
  }
  if (/nominatim/.test(host)) return "nominatim (cerca d'un lloc)";
  if (/photon/.test(host)) return "photon pobles";
  return `${host}${cami}`;
}

// Totes les peticions de la pàgina passen per aquí: el servei, l'estat i quant triga.
const fetchSenseRegistre = window.fetch.bind(window);
window.fetch = async (url, opts) => {
  const que = quePeticio(url, opts), t0 = performance.now();
  const ms = () => `${Math.round(performance.now() - t0)}ms`;
  try {
    const r = await fetchSenseRegistre(url, opts);
    // si diu que no, el perquè (el cos de l'error, que és curt)
    const perque = r.ok ? "" : (await r.clone().text().catch(() => "")).slice(0, 200).replace(/\s+/g, " ");
    reg("←", que, r.status, ms(), perque);
    return r;
  } catch (e) {
    reg("✗", que, e.name === "TimeoutError" || e.name === "AbortError" ? "temps esgotat" : `${e.name}: ${e.message}`, ms());
    throw e;
  }
};
for (const nivell of ["error", "warn"]) {
  const abans = console[nivell].bind(console);
  console[nivell] = (...a) => { reg(nivell, ...a.map((x) => x instanceof Error ? `${x.name}: ${x.message}` : String(x))); abans(...a); };
}
window.addEventListener("error", (e) => reg("error de la pàgina", e.message, `línia ${e.lineno}`));
window.addEventListener("unhandledrejection", (e) => reg("error sense recollir", String(e.reason && e.reason.message || e.reason)));

/** La capçalera: on, quan i què (la sessió sense el títol ni res de l'atleta). */
function capcaleraRegistre() {
  reg(`Ginga Rutes · ${new Date().toISOString()} · ${location.pathname}`);
  reg(`navegador: ${navigator.userAgent}`);
  reg(`pantalla: ${innerWidth}x${innerHeight} · idioma: ${L} · connexió: ${(navigator.connection && navigator.connection.effectiveType) || "?"}`);
  if (!S) reg("enllaç: cap sessió");
  else {
    const tipus = S.x ? "ruta a mida" : S.f ? "ruta feta" : "ruta de la sessió";
    reg(`enllaç: ${tipus} · signat: ${lectura.sig ? "sí" : "no"} · límit de cerques: ${ambLimit ? "sí" : "no"}`);
    if (!S.x) reg("sessió:", { d: S.d, v: S.v, s: S.s, o: S.o, k: S.k, m: S.m, p: S.p, r: S.r });
  }
  capRegistre = registre.length;
}

/** L'informe a l'entrenador: el registre i les rutes que han sortit (o cap), al Worker (worker/rutes.js), que el
    desa perquè el workflow informes-rutes l'hi enviï. */
async function enviaInforme() {
  const b = $("b-informe"), estat = $("informe-estat");
  const diu = (text) => { estat.textContent = text; estat.hidden = false; };
  if (!PROXY || !lectura || !lectura.sig) return diu(t.informeNo);
  const rutes = propostes.filter((x) => x && x.r && x.r.coords).slice(0, 5).map((x) => ({
    km: Math.round(x.r.km * 10) / 10, desnivell: Math.round(x.r.desnivell || 0),
    f: Motor.escriuPolilinia(x.r.coords), i: Motor.girsDe(x.r) }));
  reg(`informe a l'entrenador: ${rutes.length} rutes`);
  b.disabled = true; b.textContent = t.informeEnviant;
  try {
    const r = await fetch(PROXY, { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ codi: lectura.codi, sig: lectura.sig, informe: { text: registre.join("\n"), rutes } }) });
    if (!r.ok) throw new Error(`proxy ${r.status}`);
    const n = rutes.length;
    diu(omple(t.informeFet, { n: omple(t.informeRutes[Math.min(n, 2)], { n }) }));
  } catch (e) {
    console.warn("informe", e);
    diu(t.informeError);
  } finally {
    b.disabled = false; b.textContent = t.informe;
  }
}

async function enviaRegistre(copia) {
  const text = registre.join("\n");
  const boto = $(copia ? "b-reg-copia" : "b-reg-envia");
  try {
    if (!copia && navigator.share) { await navigator.share({ title: t.registre, text }); return; }
    await navigator.clipboard.writeText(text);
    boto.textContent = t.registreCopiat;
    setTimeout(() => { boto.textContent = copia ? t.registreCopia : t.registreEnvia; }, 2000);
  } catch (e) {
    if (e.name === "AbortError") return;             // ha tancat el menú de compartir
    // sense porta-retalls (http, un navegador antic): el text queda seleccionat per copiar-lo a mà
    const sel = getSelection(), rang = document.createRange();
    rang.selectNodeContents($("reg-text"));
    sel.removeAllRanges(); sel.addRange(rang);
  }
}

// ---------- estat ----------
const $ = (id) => document.getElementById(id);
const lectura = Motor.llegeixHash(location.hash);
const S = lectura && lectura.sessio;
const L = S && T[S.l] ? S.l : (navigator.language || "ca").startsWith("en") ? "en" : "ca";
const t = T[L];
document.documentElement.lang = L;
let mapa, sortida, capes = [], propostes = [], triada = 0, llavor = 0, saturat = false, quotaEsgotada = false;
let tiquet = null;              // el de la cerca d'ara (el proxy el demana si l'enllaç té límit de cerques)
const ambLimit = Boolean(S && typeof S.a === "string");   // l'enllaç porta l'atleta: una cerca per enllaç i dues per dia (worker/rutes.js)
let gent = null;                // per on va la gent a la zona: {clau, c, r, t, dades, idx}
let gentZona = null;            // la que s'ha fet servir per a les propostes d'ara (null: no ha arribat)

const fmt = (x, dec = 1) => x.toLocaleString(L === "en" ? "en-GB" : "ca-ES", { maximumFractionDigits: dec, minimumFractionDigits: 0 });
const omple = (text, vars) => text.replace(/\{(\w+)\}/g, (_, k) => vars[k] != null ? vars[k] : "");
const guarda = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const recupera = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const nomSessio = (nom) => String(nom || "").replace(/^S\d+\s+\w+\s+-\s+/, "").replace(/\bForca\b/, "Força");
const durada = (s) => s % 60 === 0 && s >= 60 ? `${s / 60}'` : s >= 60 ? `${Math.floor(s / 60)}'${String(s % 60).padStart(2, "0")}"` : `${s}"`;

function error(text) {
  reg("avís:", text);
  $("error-text").textContent = text;
  $("error").hidden = false;
}

// ---------- la sessió ----------
function pintaSessio() {
  $("titol").textContent = nomSessio(S.t);
  if (S.d) {
    const d = new Date(S.d + "T12:00:00");
    $("quan").textContent = `${t.dies[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1} · ${t[S.s] || ""}`;
  }
  const xifres = [`~${fmt(S.k)} ${t.km}`, S.m ? `~${S.m} ${t.min}` : "", S.f && S.h ? `${Math.round(S.h)} ${t.dPos}` : ""].filter(Boolean);
  // com a text, no com a HTML: el que hi ha darrere del # (km, minuts) ve de l'enllaç, i qualsevol el pot editar
  $("xifres").replaceChildren(...xifres.map((x) => Object.assign(document.createElement("span"), { textContent: x })));
  const r = S.r || {};
  const q = r.u === "m" ? (r.q >= 1000 && r.q % 1000 === 0 ? `${r.q / 1000} km` : `${r.q} m`) : durada(r.q || 0);
  const g = r.g ? (r.g[0] === r.g[1] ? r.g[0] : `${r.g[0]}-${r.g[1]}`) : "";
  let que = omple(t.perfil[S.p] || t.perfil.suau, { n: r.n, q, m: r.m, g });
  const rang = Motor.rangDesnivell(S);
  if (S.p === "desnivell" && rang) que += " " + omple(t.desnivellM, { a: rang[0] === rang[1] ? rang[0] : `${rang[0]}-${rang[1]}` });
  $("que-busquem").textContent = S.f ? t.fixa : que;
  if (S.k > 100) { $("avis").textContent = t.llarga; $("avis").hidden = false; }
  $("sessio").hidden = false;
}

// ---------- el punt de sortida ----------
function iniciaMapa() {
  $("t-sortida").textContent = S.x ? t.oPerOn : t.sortida;
  $("q").placeholder = t.placeholder;
  $("b-cerca").textContent = t.cerca;
  $("b-aqui").textContent = t.aqui;
  $("ajuda-mapa").textContent = S.x ? t.oAjuda : t.ajuda;
  $("b-busca").textContent = S.p === "pista" ? t.buscaPistes : t.busca;
  $("sortida").hidden = false;
  pintaTipusBici();

  const darrer = recupera("ginga-rutes-sortida");
  mapa = L_.map("mapa", { zoomControl: true }).setView(darrer ? [darrer[1], darrer[0]] : [41.6, 2.2], darrer ? 14 : 8);
  L_.tileLayer(TESSELES, { maxZoom: 19, attribution: S.x ? ATRIBUCIO_BROUTER : ATRIBUCIO }).addTo(mapa);
  if (darrer && !S.x) posaSortida(darrer, false);
  mapa.on("click", (e) => (S.x ? afegeixPunt : posaSortida)([e.latlng.lng, e.latlng.lat]));

  $("cerca").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = $("q").value.trim();
    if (!q) return;
    const llista = $("llocs");
    llista.hidden = true;
    try {
      const url = `${NOMINATIM}?format=jsonv2&limit=5&q=${encodeURIComponent(q)}&accept-language=${L}`;
      const llocs = await (await fetch(url)).json();
      if (!llocs.length) { llista.innerHTML = `<li class="muted">${t.capLloc}</li>`; llista.hidden = false; return; }
      if (llocs.length === 1) return triaLloc(llocs[0]);
      llista.innerHTML = "";
      for (const lloc of llocs) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = lloc.display_name;
        b.addEventListener("click", () => { llista.hidden = true; triaLloc(lloc); });
        li.append(b);
        llista.append(li);
      }
      llista.hidden = false;
    } catch (err) {
      llista.innerHTML = `<li class="muted">${t.capLloc}</li>`;
      llista.hidden = false;
    }
  });

  $("b-aqui").addEventListener("click", () => {
    if (!navigator.geolocation) return error(t.senseGps);
    navigator.geolocation.getCurrentPosition(
      (p) => {
        const aqui = [p.coords.longitude, p.coords.latitude];
        S.x ? afegeixPunt(aqui, "sortida", t.onSoc) : posaSortida(aqui);
        mapa.setView([p.coords.latitude, p.coords.longitude], 15); },
      () => error(t.gpsDenegat), { enableHighAccuracy: true, timeout: 15000 });
  });

  $("b-busca").addEventListener("click", () => {
    S.x ? buscaOberta() : S.p === "pista" ? buscaPistes() : buscaCircuits(S);
  });
}

// ---------- el tipus de bici ----------
// A la bici, l'atleta tria carretera, gravel o BTT (en Joan, 28/10/2026); per defecte, el de la sessió del pla. El
// proxy fa servir el triat (perfil a la petició, worker/rutes.js) i la pàgina hi aplica les regles de cada un: a la
// de carretera, 100% per carretera. No es recorda: cada sessió comença amb el que diu el pla. Amb límit de cerques
// (una per enllaç), es tria abans de buscar.
const BICIS = ["cycling-road", "cycling-regular", "cycling-mountain"];

function pintaTipusBici() {
  const caixa = $("tipus-bici");
  if (S.s !== "ride" || !BICIS.includes(S.o) || S.p === "pista") return;
  caixa.setAttribute("aria-label", t.tipusBici);
  caixa.replaceChildren(...BICIS.map((o) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn petit" + (o === S.o ? "" : " sec");
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", String(o === S.o));
    b.textContent = t.bicis[o];
    b.addEventListener("click", () => triaBici(o));
    return b;
  }));
  caixa.hidden = false;
}

function triaBici(o) {
  if (o === S.o) return;
  S.o = o;
  pintaTipusBici();
  oblidaPropostes();             // eren d'un altre tipus de bici: a tornar a buscar
}

function oblidaPropostes() {
  if (!propostes.length) return;
  propostes = [];
  triada = 0;
  netejaCapes();
  $("resultats").replaceChildren();
  $("resultats").hidden = true;
}

function triaLloc(lloc) {
  const p = [Number(lloc.lon), Number(lloc.lat)];
  mapa.setView([p[1], p[0]], 15);
  S.x ? afegeixPunt(p, posa, String(lloc.display_name || "").split(",")[0]) : posaSortida(p);
}

let marcaSortida;
function posaSortida(p, desa = true) {
  sortida = p;
  reg("sortida", aprox(p));
  llavor = 0;                   // un altre punt de sortida: les llavors tornen a començar; el mateix, en dona de noves
  if (desa) guarda("ginga-rutes-sortida", p);
  if (!marcaSortida) {
    marcaSortida = L_.marker([p[1], p[0]], { draggable: true }).addTo(mapa);
    marcaSortida.on("dragend", () => { const ll = marcaSortida.getLatLng(); posaSortida([ll.lng, ll.lat]); });
  } else {
    marcaSortida.setLatLng([p[1], p[0]]);
  }
  $("b-busca").disabled = false;
}

// ---------- la ruta feta ----------
// Un enllaç de coach/ruta_fixa.py: la ruta ja hi és, sense triar d'on surts ni calcular res.
function mostraRutaFixa() {
  for (const id of ["t-sortida", "cerca", "b-aqui", "ajuda-mapa", "b-busca"]) $(id).hidden = true;
  $("sortida").hidden = false;
  mapa = L_.map("mapa", { zoomControl: true }).setView([41.6, 2.2], 8);
  L_.tileLayer(TESSELES, { maxZoom: 19, attribution: ATRIBUCIO_BROUTER }).addTo(mapa);   // la ruta és de BRouter
  propostes = [{ r: Motor.rutaFixa(S) }];
  pintaPropostes(S);
}

// ---------- ruta a mida ----------
// L'enllaç personal de coach/ruta_oberta.py (camp x, signat; Garmin a nom de l'atleta): l'esport, el terreny, els km i
// el desnivell (de-a), i la sortida, els punts de pas i l'arribada al mapa. La calcula BRouter (Motor.rutaOberta), a
// través del proxy, que només respon als enllaços signats per Ginga (tots ho han de ser: en Joan, 29/10/2026); no
// gasta la quota d'openrouteservice. A peu, amb el nostre perfil (correr.brf, també per asfalt), que es puja a BRouter
// abans; en bici, amb els de BRouter. Es recorda en aquest navegador el que es tria (no els punts).
const OBERTA = "ginga-rutes-oberta";
const MOGUT_M = 150;            // m: més a prop, és la sortida que volia
const oberta = { s: "run", run: "camins", ride: "cycling-road", km: [8, 10], d: [null, null], ...(recupera(OBERTA) || {}) };
let punts = [];                 // [{p: [lon, lat], rol: "sortida" | "pas" | "arribada", nom, marca}]
let posa = "sortida";           // què posa un toc al mapa
let llavorOberta = 0;
let obertaAB = false;           // la de les propostes d'ara acaba en un altre lloc
const distancia = (m) => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${fmt(m / 1000)} km`;

function botons(caixa, opcions, actiu, tria) {
  caixa.replaceChildren(...opcions.map(([v, text]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn petit" + (v === actiu ? "" : " sec");
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", String(v === actiu));
    b.textContent = text;
    b.addEventListener("click", () => tria(v));
    return b;
  }));
}

function pintaOberta() {
  const canvia = (camp) => (v) => { oberta[camp] = v; guarda(OBERTA, oberta); oblidaPropostes(); pintaOberta(); };
  botons($("o-esport"), Object.entries(t.oEsport), oberta.s, canvia("s"));
  botons($("o-terreny"), oberta.s === "run" ? Object.entries(t.oTerreny) : BICIS.map((o) => [o, t.bicis[o]]),
    oberta[oberta.s], canvia(oberta.s));
  $("o-terreny").setAttribute("aria-label", oberta.s === "run" ? t.terreny : t.tipusBici);
  botons($("o-posa"), Object.entries(t.rols), posa, (v) => { posa = v; pintaOberta(); });
}

function iniciaOberta() {
  $("titol").textContent = t.aMida;
  $("o-t-km").textContent = t.oKm;
  $("o-t-d").textContent = t.oD;
  const camps = [["o-km0", "km", 0], ["o-km1", "km", 1], ["o-d0", "d", 0], ["o-d1", "d", 1]];
  for (const [id, camp, i] of camps) {
    const input = $(id);
    input.setAttribute("aria-label", `${camp === "km" ? t.oKm : t.oD}: ${i ? t.oA : t.oDe}`);
    if (oberta[camp][i] != null) input.value = oberta[camp][i];
    input.addEventListener("change", () => {
      const v = parseFloat(input.value);
      oberta[camp][i] = Number.isFinite(v) && v >= 0 ? v : null;
      guarda(OBERTA, oberta);
      oblidaPropostes();
    });
  }
  $("oberta").hidden = false;
  pintaOberta();
  iniciaMapa();
  $("o-posa").hidden = false;
  pintaPunts();
}

const lletra = (x) => t.lletres[x.rol] || String(punts.filter((y) => y.rol === "pas").indexOf(x) + 1);
const iconaPunt = (x) => L_.divIcon({ className: "", html: `<div class="marca-punt ${x.rol}">${lletra(x)}</div>`, iconSize: [26, 26] });

/** Un punt nou al mapa. Sortida i arribada, només una de cada (la d'abans passa a ser un punt de pas). */
function afegeixPunt(p, rol = posa, nom = "") {
  for (const y of punts) if (rol !== "pas" && y.rol === rol) y.rol = "pas";
  const x = { p, rol, nom };
  x.marca = L_.marker([p[1], p[0]], { draggable: true, icon: L_.divIcon({ className: "" }) }).addTo(mapa);
  x.marca.on("dragend", () => { const ll = x.marca.getLatLng(); x.p = [ll.lng, ll.lat]; x.nom = ""; oblidaPropostes(); pintaPunts(); });
  punts.push(x);
  if (rol === "sortida") guarda("ginga-rutes-sortida", p);
  if (rol !== "pas") posa = "pas";
  oblidaPropostes();
  pintaPunts();
  pintaOberta();
}

function pintaPunts() {
  const ordre = { sortida: 0, pas: 1, arribada: 2 };
  punts.sort((a, b) => ordre[a.rol] - ordre[b.rol]);       // els de pas, en l'ordre que s'han posat
  $("o-punts").replaceChildren(...punts.map((x) => {
    x.marca.setIcon(iconaPunt(x));
    const li = document.createElement("li");
    const marca = Object.assign(document.createElement("span"), { className: `marca-punt ${x.rol}`, textContent: lletra(x) });
    const nom = Object.assign(document.createElement("span"), { className: "nom",
      textContent: x.nom || `${x.p[1].toFixed(5)}, ${x.p[0].toFixed(5)}` });
    const rol = document.createElement("select");
    rol.setAttribute("aria-label", nom.textContent);
    for (const [v, text] of Object.entries(t.rols)) rol.add(new Option(text, v, false, v === x.rol));
    rol.addEventListener("change", () => {
      for (const y of punts) if (rol.value !== "pas" && y.rol === rol.value) y.rol = "pas";
      x.rol = rol.value;
      oblidaPropostes();
      pintaPunts();
    });
    const treu = Object.assign(document.createElement("button"), { type: "button", className: "treu", textContent: "✕" });
    treu.setAttribute("aria-label", `${t.treu}: ${nom.textContent}`);
    treu.addEventListener("click", () => { x.marca.remove(); punts = punts.filter((y) => y !== x); oblidaPropostes(); pintaPunts(); });
    li.append(marca, nom, rol, treu);
    return li;
  }));
  $("o-punts").hidden = !punts.length;
  $("b-busca").disabled = !punts.some((x) => x.rol === "sortida");
}

/** encamina(punts, alternativa) per a Motor.rutaOberta: BRouter pel proxy, esglaonat i sense repetir cap petició. */
async function encaminador(p) {
  let perfil = Motor.PERFILS_BROUTER[p.o];
  if (p.s === "run") {
    const brf = await (await fetch("correr.brf")).text();
    const r = await (await fetch(`${BROUTER}/profile`, { method: "POST", headers: { "content-type": "text/plain" }, body: brf })).json();
    if (!r.profileid || r.error) throw new Error("perfil");
    perfil = r.profileid;
  }
  const fetes = new Map();
  let proxima = 0;
  return (via, alt = 0) => {
    const clau = `${via.map((q) => `${q[0].toFixed(6)},${q[1].toFixed(6)}`).join("|")}/${alt}`;
    if (!fetes.has(clau)) fetes.set(clau, (async () => {
      const ara = Date.now(), quan = Math.max(ara, proxima);
      proxima = quan + BROUTER_ESGLAO_MS;                  // el servidor de BRouter és de tothom
      await new Promise((ok) => setTimeout(ok, quan - ara));
      const r = await fetch(PROXY, { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ codi: lectura.codi, sig: lectura.sig, brouter: { punts: via, perfil, alt, asfalt: p.asfalt } }),
        signal: AbortSignal.timeout ? AbortSignal.timeout(BROUTER_SEGONS * 1000) : undefined }).catch(() => null);
      if (r && r.status === 403) throw new Error("signatura");
      const geo = r && r.ok ? await r.json().catch(() => null) : null;
      return geo && geo.features && geo.features[0] ? Motor.resumeix(Motor.deBrouter(geo)) : null;
    })());
    return fetes.get(clau);
  };
}

async function buscaOberta(mes = false) {
  const res = $("resultats");
  const diu = (text) => { netejaCapes(); res.replaceChildren(Object.assign(document.createElement("p"), { textContent: text })); res.hidden = false; };
  const de = (rol) => (punts.find((x) => x.rol === rol) || {}).p || null;
  const [k0, k1] = oberta.km, [d0, d1] = oberta.d;
  if (!PROXY || !lectura.sig) return diu(t.senseSignatura);
  if (!de("sortida")) return diu(t.oFalta);
  if (!(k0 > 0 && k1 >= k0 && k1 <= 200)) return diu(t.oKmMal);
  llavorOberta = mes ? llavorOberta + 1 : 0;
  const p = {
    s: oberta.s, o: oberta.s === "run" ? (oberta.run === "asfalt" ? "foot-walking" : "foot-hiking") : oberta.ride,
    asfalt: oberta.s === "run" && oberta.run === "asfalt", sortida: de("sortida"), arribada: de("arribada"),
    pas: punts.filter((x) => x.rol === "pas").map((x) => x.p), km: [k0, k1],
    desnivell: d0 != null || d1 != null ? [d0 || 0, d1 != null ? d1 : 1e9] : null,
  };
  Object.assign(S, { s: p.s, o: p.o, k: (k0 + k1) / 2, t: t.aMida });     // per al GPX, Garmin i les propostes
  const b = $("b-busca");
  b.disabled = true; b.textContent = t.buscant;
  reg("── ruta a mida", { s: p.s, o: p.o, km: p.km, desnivell: p.desnivell, pas: p.pas.length, arribada: Boolean(p.arribada), mes: llavorOberta });
  try {
    const { propostes: ps, motiu } = await Motor.rutaOberta(p, await encaminador(p), llavorOberta);
    reg(`ruta a mida: ${ps.length} propostes`, motiu || "", ps.map((c) => `${c.r.km.toFixed(1)}km +${Math.round(c.r.desnivell || 0)}m mogut${Math.round(c.mogut || 0)}m`).join(" "));
    if (!ps.length) return diu(t.oCap);
    obertaAB = Boolean(p.arribada);
    propostes = ps.map((c) => ({ r: c.r, mogut: c.mogut, ab: obertaAB, d: p.desnivell }));
    triada = 0;
    pintaPropostes(S);
    const notes = [motiu === "lluny" ? omple(t.oLluny, { k: `${fmt(k0)}-${fmt(k1)}` })
      : motiu === "fora" ? omple(t.oFora, { a: fmt(k0), b: fmt(k1) }) : "", ps[0].mogut > MOGUT_M ? t.oMogutNota : ""];
    res.prepend(...notes.filter(Boolean).map((x) => Object.assign(document.createElement("p"), { className: "avis", textContent: x })));
  } catch (e) {
    console.error(e);
    diu(e.message === "signatura" ? t.senseSignatura : t.oError);
  } finally {
    b.disabled = false; b.textContent = t.busca;
  }
}

    });

// ---------- per on va la gent ----------
// Rutes senyalitzades, vies verdes, parcs i passejos d'OpenStreetMap al voltant de la sortida. Es guarda al mòbil
// per no tornar-ho a demanar cada cop: Overpass sovint va saturat. Si no arriba a temps, els circuits surten igual.
// "run2": a peu, també els corriols sense prova (els desats abans no en porten)
const tipusGent = (sessio) => sessio.s === "run" ? "run2" : sessio.o === "cycling-road" ? "road" : "ride";
const ambIndex = (g) => ({ ...g, idx: Motor.indexGent(g.dades), idxC: Motor.indexGent({ l: g.dades.c || [], p: [] }) });
const serveix = (g, clau, p, radi) => Boolean(g) && g.clau === clau && Motor.dist(g.c, p) + radi <= g.r;

async function carregaGent(sessio, p) {
  const clau = tipusGent(sessio), radi = Motor.radiGent(sessio);
  if (serveix(gent, clau, p, radi)) return gent;
  const desat = recupera("ginga-rutes-gent");
  if (serveix(desat, clau, p, radi) && Date.now() - desat.t < GENT_DIES * 864e5) {
    return (gent = ambIndex(desat));
  }
  const r = radi + GENT_MARGE;
  const consulta = Motor.consultaGent(p[1], p[0], r, sessio);
  // els servidors saturats sovint diuen que no de seguida: una segona volta al cap d'un moment
  const resposta = await overpass(consulta, 25).catch(() => new Promise((ok) => setTimeout(ok, 2000)).then(() => overpass(consulta, 25)));
  const dades = Motor.llegeixGent(resposta);
  const nou = { clau, c: p, r, t: Date.now(), dades };
  if (JSON.stringify(dades).length < 2e6) guarda("ginga-rutes-gent", nou);    // el mòbil en guarda uns 5 MB per pàgina
  return (gent = ambIndex(nou));
}

/** La gent de la zona, o null si Overpass no respon en GENT_SEGONS (llavors els circuits es trien com sempre). */
function gentATemps(sessio, p) {
  const carrega = carregaGent(sessio, p).catch((e) => { console.warn("gent", e); return null; });
  return Promise.race([carrega, new Promise((ok) => setTimeout(() => ok(null), GENT_SEGONS * 1000))]).then((g) => {
    reg(g ? `per on va la gent: ${g.idx.buit ? "cap via a la zona" : "a punt"}` : `per on va la gent: no ha arribat en ${GENT_SEGONS}s (es tria sense)`);
    return g;
  });
}

// ---------- circuits ----------
/**
 * El tiquet d'una cerca nova. Si el proxy diu que l'enllaç o l'atleta ja han fet les seves, error amb el motiu;
 * si falla per qualsevol altra cosa (un proxy d'abans, que no en dona), es busca igual sense tiquet.
 */
async function demanaTiquet() {
  const r = await fetch(PROXY, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ codi: lectura.codi, sig: lectura.sig, cerca: "nova" }),
  }).catch(() => null);
  const cos = r ? await r.json().catch(() => ({})) : {};
  if (r && r.status === 429 && cos.error === "limit") throw new Error(cos.motiu === "dia" ? "limitDia" : "limitEnllac");
  if (r && r.status === 410) throw new Error("caducat");
  return (r && r.ok && cos.tiquet) || null;
}

async function demana(seed, factor, via, evita) {
  const r = await fetch(PROXY, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ codi: lectura.codi, sig: lectura.sig, tiquet, inici: sortida, seed, factor, via, evita, perfil: S.o }),
  });
  if (r.status === 410) throw new Error("caducat");
  if (r.status === 403 || r.status === 429) {
    // el 403 del proxy és la signatura; el d'openrouteservice ("Quota exceeded"), la quota del dia esgotada;
    // el 429, el límit per minut. Tots dos d'openrouteservice són per a tots els atletes alhora.
    const cos = await r.json().catch(() => ({}));
    if (cos.error === "signatura") throw new Error("signatura");
    if (r.status === 403) quotaEsgotada = true; else saturat = true;
    return null;
  }
  if (!r.ok) return null;                       // 404 de openrouteservice: cap circuit des d'aquí amb aquesta llavor
  const fc = await r.json();
  return fc.features && fc.features[0] ? { feature: fc.features[0], seed, factor } : null;
}

/** La millor de cada llavor, i fora les que són pràcticament el mateix circuit (mateixos km i mateix punt més llunyà). */
function diferents(cands) {
  const triats = [];
  for (const c of cands) {                                   // ja venen ordenats, de millor a pitjor
    const lluny = c.r.coords[Math.floor(c.r.coords.length / 2)];
    const igual = triats.some((x) => x.seed === c.seed || (Math.abs(x.r.km - c.r.km) / c.r.km < 0.03
      && Motor.dist(lluny, x.r.coords[Math.floor(x.r.coords.length / 2)]) < 150));
    if (!igual) triats.push(c);
  }
  return triats;
}

/**
 * Bici de carretera: un circuit amb trams de terra, pista o camí es torna a demanar passant pels mateixos llocs
 * però evitant aquests trams, fins que és 100% per carretera (o es dona per perdut). Mesurat a l'Empordà: 1 de
 * cada 10 circuits d'openrouteservice ja surt net; reparats, 3 de cada 4.
 *
 * Per parts: primer la terra (obligatori) i després, si encara hi ha trams llargs per carretera principal, fins a
 * tres passades més per treure'ls. Cada una evita també la terra o les principals noves de l'anterior (abans, una
 * sola passada i, si sortia un tros de terra, es llençava). Un circuit dins del límit de carretera principal
 * (Motor.limitPrincipal) passa davant d'un que no, encara que sigui més llarg (fins a MAX_ERR_KM): «prefereixo fer
 * una ruta un % més llarga» (en Joan, 30/10/2026; abans, només si s'allargava menys d'un 20%). Si l'única manera de
 * passar un riu o l'autopista és un pont de la C-260, evitar-la fa fer voltes de 100 km (passava des de Llers): per
 * això el límit no és zero.
 *
 * A peu, el mateix amb els corriols que potser no existeixen (valora): fora, i sense la passada de les principals.
 */
async function repara(c, sessio) {
  const k = Math.min(sessio.k, 100);
  const err = (x) => Math.abs(x.r.km - k) / k;
  const val = (x) => x && !x.r.foraCarretera && !x.r.voltes.length && err(x) <= MAX_ERR_KM;
  const massa = (x) => (Motor.esCarretera(sessio) && x.r.massaPrincipal ? 1 : 0);
  const millorQue = (x, y) => !y || (massa(x) - massa(y) || x.pena - y.pena) < 0;
  let millor = val(c) ? c : null, actual = c;
  const evita = [];
  const afegeix = (punts, max) => { const n = evita.length; for (const p of punts) if (evita.length < max) evita.push(p); return evita.length > n; };
  // amb molta terra, un punt cada més de 60 m, perquè la terra no s'acabi els punts de les principals
  const cada = (r, max) => Math.max(60, r.foraCarretera / Math.max(1, max - evita.length));
  for (let passada = 0; passada < REPARACIONS && (actual.r.foraCarretera || actual.r.voltes.length); passada++) {
    const max = MAX_EVITA - RESERVA_PRINCIPALS;
    // les voltes per allargar (des del 26/10 no es proposen), com la terra: sense punts de pas a dins, i evitant-ne
    // la punta (abans, un circuit net de terra però amb una volta es llençava i a la bici gairebé no en quedava cap)
    afegeix(Motor.puntesVoltes(actual.r), max);
    afegeix(Motor.puntsAEvitar(actual.r, cada(actual.r, max), false), max);
    const nou = await demana(c.seed, c.factor, Motor.puntsDePas(actual.r), evita);
    if (!nou) break;
    actual = valora(nou, sessio);
    if (val(actual) && millorQue(actual, millor)) millor = actual;
  }
  for (let passada = 0, base = millor; Motor.esCarretera(sessio) && passada < PASSADES_TRANSIT && base && (base.r.tramsPrincipals || base.r.foraCarretera); passada++) {
    if (!afegeix(Motor.puntsAEvitar(base.r, cada(base.r, MAX_EVITA), true), MAX_EVITA)) break;   // cap punt nou: sortiria igual
    const nou = await demana(c.seed, c.factor, Motor.puntsDePas(base.r), evita);
    const x = nou && valora(nou, sessio);
    if (!x || err(x) > MAX_ERR_KM) break;
    if (val(x) && millorQue(x, millor)) millor = x;
    base = x;
  }
  return millor;
}

/**
 * Si openrouteservice no en dona cap que quedi bé, o no queda quota: BRouter, pels pobles del voltant (Motor.perPobles).
 * Passava a Calaf: tots els circuits per camins de terra, i per carretera n'hi havia de sobres. Les mateixes regles
 * que els d'openrouteservice (val, i a menys d'un MAX_ERR_KM dels km).
 */
async function perPobles(sessio, val) {
  const perfil = Motor.PERFILS_BROUTER[sessio.o];
  if (!perfil) return [];
  const k = Math.min(sessio.k, 100);
  const radi = Math.min(30000, k * 1000 * 0.6);
  const espera = { signal: AbortSignal.timeout ? AbortSignal.timeout(POBLES_SEGONS * 1000) : undefined };
  let pobles = Motor.llegeixPobles(...await Promise.all(Motor.consultaPobles(sortida[1], sortida[0], radi)
    .map((u) => fetch(u, espera).then((r) => r.json()).catch(() => null))));
  if (pobles.length < 2) {
    pobles = Motor.llegeixPobles(await overpass(Motor.consultaPoblesOverpass(sortida[1], sortida[0], radi), POBLES_SEGONS)
      .catch(() => null));
  }
  const cands = Motor.perPobles(sortida, pobles, k, BROUTER_N);
  reg(`pobles a ${Math.round(radi / 1000)} km: ${pobles.length}; recorreguts per provar: ${cands.length}`);
  const ruta = async (via, seed) => {
    const punts = [sortida, ...via, sortida].map((p) => `${p[0].toFixed(6)},${p[1].toFixed(6)}`).join("|");
    const r = await fetch(`${BROUTER}?lonlats=${punts}&profile=${perfil}&alternativeidx=0&format=geojson&timode=2`,
      { signal: AbortSignal.timeout ? AbortSignal.timeout(BROUTER_SEGONS * 1000) : undefined }).catch(() => null);
    const geo = r && r.ok ? await r.json().catch(() => null) : null;
    return geo && geo.features && geo.features[0] ? valora({ feature: Motor.deBrouter(geo), seed, factor: 1 }, sessio) : null;
  };
  const demanaB = async (c, i) => {
    await new Promise((ok) => setTimeout(ok, i * BROUTER_ESGLAO_MS));      // el servidor de BRouter és de tothom
    let x = await ruta(c.via, `b${i}`);
    const via = x && Motor.viaForaVoltes(x.r, c.via);                       // entrar al poble i tornar a sortir
    if (via) x = (await ruta(via, `b${i}`)) || x;
    return x && (!val || val(x)) && !x.r.voltes.length && Math.abs(x.r.km - k) / k <= MAX_ERR_KM ? { ...x, anada: c.anada } : null;
  };
  return (await Promise.all(cands.map(demanaB))).filter(Boolean).sort((a, b) => a.pena - b.pena);
}

function valora(c, sessio) {
  const r = Motor.resumeix(c.feature);
  r.gent = gentZona && !gentZona.idx.buit ? Motor.perOnVaLaGent(r.coords, r.acc, gentZona.idx) : null;
  if (sessio.s === "run") {
    // a peu, els trams que s'han de treure (com la terra a la bici de carretera) són els corriols sense prova
    const ex = c.feature.properties.extras || {};
    const d = Motor.corriolsDubtosos(r.coords, r.acc, ex.waytype || ex.waytypes, gentZona && gentZona.idxC);
    r.dolents = d.mascara;
    r.foraCarretera = r.corriols = d.metres;
  }
  let pena = Motor.penalitza(r, sessio);
  let pujada = null;
  if (sessio.p === "pujades") {
    pujada = Motor.millorPujada(r.coords, r.acc, sessio.r);
    pena += pujada ? pujada.pena : 5;
  }
  return { ...c, r, pena, pujada };
}

async function buscaCircuits(sessio) {
  const res = $("resultats");
  if (!PROXY) { res.innerHTML = `<p>${t.senseProxy}</p>`; res.hidden = false; return; }
  if (!lectura.sig) { res.innerHTML = `<p>${t.senseSignatura}</p>`; res.hidden = false; return; }
  const b = $("b-busca");
  b.disabled = true; b.textContent = t.buscant;
  saturat = quotaEsgotada = false;
  reg("── circuits des de", aprox(sortida), { s: sessio.s, o: sessio.o, k: sessio.k, p: sessio.p, llavor });
  try {
    tiquet = await demanaTiquet();
    reg("tiquet:", tiquet ? "sí" : "no");
    const factor = FACTOR[sessio.s] || 0.9;
    const esperaGent = gentATemps(sessio, sortida);             // alhora que els circuits
    const tanda = async (f, n) => {
      const llavors = Array.from({ length: n }, (_, i) => llavor + i);
      llavor += n;
      const crus = (await Promise.all(llavors.map((s) => demana(s, f)))).filter(Boolean);
      gentZona = await esperaGent;
      const vals = crus.map((c) => valora(c, sessio));
      reg(`tanda factor=${f.toFixed(2)}: ${crus.length} de ${n} circuits`, kms(vals));
      return vals;
    };
    let cands = await tanda(factor, LLAVORS);
    const kObjectiu = Math.min(sessio.k, 100);
    const err = (c) => Math.abs(c.r.km - kObjectiu) / kObjectiu;
    if (cands.length && !cands.some((c) => err(c) <= MARGE_KM && !c.r.voltes.length)) {
      // tots massa llargs, massa curts o amb voltes per allargar: una tanda més, amb la llargada corregida per la
      // mediana del que ha sortit
      const ratis = cands.map((c) => c.r.km / (kObjectiu * factor)).sort((a, b) => a - b);
      const mediana = ratis[Math.floor(ratis.length / 2)];
      cands = cands.concat(await tanda(Math.max(0.6, Math.min(1.5, 1 / mediana)), 4));
    }
    cands.sort((a, b) => a.pena - b.pena);
    const trobats = cands.length;
    // bici de carretera: 100% per carretera, per carreteres locals i sense voltes; a peu: cap corriol sense prova
    const bo = Motor.esCarretera(sessio) ? (c) => !c.r.foraCarretera && !c.r.tramsPrincipals && !c.r.voltes.length
      : sessio.s === "run" ? (c) => !c.r.corriols : null;
    // i el que no es proposa mai: a la bici de carretera, la terra i passar del límit de carretera principal
    const val = Motor.esCarretera(sessio) ? (c) => !c.r.foraCarretera && !c.r.massaPrincipal : bo;
    if (bo) {
      // els que ja ho són valen; els 3 millors dels altres es reparen
      // esglaonades, perquè no arribin totes alhora al límit per minut d'openrouteservice
      const reparats = await Promise.all(cands.filter((c) => !bo(c)).slice(0, 3)
        .map((c, i) => new Promise((ok) => setTimeout(ok, i * ESGLAO_MS)).then(() => repara(c, sessio))));
      reg(`ja bons: ${cands.filter(bo).length}; reparats: ${reparats.filter(Boolean).length} de ${reparats.length}`, kms(reparats.filter(Boolean)));
      cands = cands.filter(bo).concat(reparats.filter(Boolean)).sort((a, b) => a.pena - b.pena);
    }
    // mai un circuit que s'allunyi massa dels km de la sessió (abans en sortien de 150 km per a una de 36), ni un
    // que faci voltes a una rotonda o anades i tornades per allargar: millor més curt o una mica més llarg. Ni, a la
    // bici de carretera, un que passi del límit de carretera principal (abans, els reparats s'hi quedaven igual)
    propostes = diferents(cands.filter((c) => err(c) <= MAX_ERR_KM && !c.r.voltes.length && (!val || val(c)))).slice(0, 3);
    reg(`d'openrouteservice: ${propostes.length} propostes`, kms(propostes));
    if (!propostes.length) {
      reg("cap d'openrouteservice: per pobles (BRouter)");
      propostes = diferents(await perPobles(sessio, val)).slice(0, 3);   // BRouter
      reg(`per pobles: ${propostes.length} propostes`, kms(propostes));
    }
    if (!propostes.length) {
      // amb límit de cerques, no li diem que torni a buscar
      const cap = Motor.esCarretera(sessio) ? (ambLimit ? t.capCarreteraUna : t.capCarretera)
        : sessio.s === "run" && trobats && !ambLimit ? t.capCorriols : (ambLimit ? t.capRutaUna : t.capRuta);
      reg(`cap proposta · trobats ${trobats} · quota esgotada: ${quotaEsgotada ? "sí" : "no"} · saturat: ${saturat ? "sí" : "no"}`);
      res.innerHTML = `<p>${quotaEsgotada ? t.quota : saturat ? t.saturat : omple(cap, { k: fmt(kObjectiu, 0) })}</p>`;
      res.hidden = false; netejaCapes(); return;
    }
    pintaPropostes(sessio);
  } catch (e) {
    console.error(e);
    if (e.message.startsWith("limit") && propostes.length) {
      // ja n'havia buscat: les propostes d'abans es queden, amb l'avís a sobre
      pintaPropostes(sessio);
      const avis = document.createElement("p");
      avis.textContent = t[e.message];
      res.prepend(avis);
      return;
    }
    res.innerHTML = `<p>${e.message === "caducat" ? omple(t.caducat, { d: S.d }) : e.message === "signatura" ? t.senseSignatura
      : e.message.startsWith("limit") ? t[e.message] : t.errorProxy}</p>`;
    res.hidden = false;
  } finally {
    b.disabled = false; b.textContent = S.p === "pista" ? t.buscaPistes : t.busca;
  }
}

function getVar(nom) { return getComputedStyle(document.documentElement).getPropertyValue(nom).trim(); }

function netejaCapes() { capes.forEach((c) => c.remove()); capes = []; }

function pintaPropostes(sessio) {
  const res = $("resultats");
  res.innerHTML = "";
  propostes.forEach((p, n) => {
    const r = p.r;
    const div = document.createElement("div");
    div.className = "proposta" + (n === triada ? " triada" : "");
    const detalls = p.anada ? [t.anada] : [];
    if (p.mogut > MOGUT_M) detalls.push(omple(p.ab ? t.oMogutAB : t.oMogut, { d: distancia(p.mogut) }));
    if (p.d && (r.desnivell < p.d[0] || r.desnivell > p.d[1])) detalls.push(t.oDFora);
    if (Motor.esCarretera(sessio)) {
      detalls.push(t.carretera100, t.transit[Motor.grauTransit(r.transit)]);
      if (r.principal > 0.03) detalls.push(omple(t.principal, { x: Math.round(100 * r.principal) }));
    }
    else if (sessio.s === "ride" ? r.senseAsfalt > 0.05 : r.senseAsfalt > 0.2) detalls.push(omple(t.senseAsfalt, { x: Math.round(100 * r.senseAsfalt) }));
    if (sessio.s === "run" && r.carretera > 0.15) detalls.push(omple(t.carretera, { x: Math.round(100 * r.carretera) }));
    if (r.gent != null && r.gent >= 0.05) detalls.push(omple(t.gent, { x: Math.round(100 * r.gent) }));
    let pujada = "";
    if (p.pujada) {
      const g = sessio.r.g, encaixa = p.pujada.pendent >= g[0] - 0.5 && p.pujada.pendent <= g[1] + 0.5;
      pujada = omple(encaixa ? t.pujada : t.senseAPujada, { a: fmt(p.pujada.aKm), m: Math.round(p.pujada.llarg / 10) * 10, g: fmt(p.pujada.pendent) });
    }
    div.innerHTML = `<div class="cap"><h2>${S.f ? t.laRuta : omple(t.proposta, { n: n + 1 })}</h2>${S.f ? "" : `<button type="button" data-veure>${t.veure}</button>`}</div>
      <div class="xifres"><span>${fmt(r.km)} ${t.km}</span><span>${Math.round(r.desnivell)} ${t.dPos}</span></div>
      ${detalls.length ? `<p class="muted">${detalls.join(" · ")}</p>` : ""}
      ${pujada ? `<p>${pujada}</p>` : ""}
      <div class="fila"><button class="btn sec petit" type="button" data-gpx>${t.gpx}</button>
      ${ambGarmin() ? `<button class="btn sec petit" type="button" data-garmin>${t.garmin}</button>` : ""}
      ${alMobil() ? `<button class="btn sec petit" type="button" data-osmand>${t.osmand}</button>` : ""}
      <button class="btn petit" type="button" data-segueix>${t.segueix}</button></div>`;
    if (!S.f) div.querySelector("[data-veure]").addEventListener("click", () => { triada = n; pintaPropostes(sessio); });
    div.querySelector("[data-gpx]").addEventListener("click", () => descarregaGpx(p, n));
    const bg = div.querySelector("[data-garmin]");
    if (bg) bg.addEventListener("click", () => enviaGarmin(rutaGarmin(p, n), bg));
    // OsmAnd segueix la ruta amb el mòbil bloquejat (el navegador, no: «Segueix-la ara» vol la pantalla encesa)
    const bOsm = div.querySelector("[data-osmand]");
    if (bOsm) bOsm.addEventListener("click", async () => {
      if ((await descarregaGpx(p, n)) !== "descarregat" || div.querySelector(".osmand")) return;
      const nota = document.createElement("p");        // Android: el GPX no es pot compartir i s'ha descarregat
      nota.className = "muted osmand";
      nota.textContent = t.osmandBaixat;
      div.append(nota);
    });
    div.querySelector("[data-segueix]").addEventListener("click", () => segueix(p));
    res.append(div);
  });
  if (gentZona && !gentZona.idx.buit) {
    const llegenda = document.createElement("p");
    llegenda.className = "llegenda";
    llegenda.innerHTML = "<i></i>";
    llegenda.append(sessio.s === "run" ? t.llegendaRun : t.llegendaRide);
    res.append(llegenda);
  }
  if (!S.f && !ambLimit) {           // amb límit, «més opcions» seria una cerca nova
    const mes = document.createElement("button");
    mes.className = "btn sec petit";
    mes.type = "button";
    mes.textContent = L === "en" ? "More options" : "Més opcions";
    mes.addEventListener("click", () => { triada = 0; S.x ? buscaOberta(true) : buscaCircuits(sessio); });
    res.append(mes);
  }
  res.hidden = false;
  dibuixa();
}

let pintorGent;
function dibuixa() {
  netejaCapes();
  if (gentZona && !gentZona.idx.buit) {
    if (!pintorGent) {              // per sota de les rutes, en canvas perquè poden ser milers de trams
      mapa.createPane("gent").style.zIndex = 350;
      pintorGent = L_.canvas({ pane: "gent", padding: 0.3 });
    }
    const ll = (pla) => { const x = []; for (let i = 0; i + 1 < pla.length; i += 2) x.push([pla[i + 1], pla[i]]); return x; };
    const color = getVar("--gent");
    if (gentZona.dades.p.length) capes.push(L_.polygon(gentZona.dades.p.map(ll),
      { renderer: pintorGent, stroke: false, fillColor: color, fillOpacity: .12, interactive: false }).addTo(mapa));
    if (gentZona.dades.l.length) capes.push(L_.polyline(gentZona.dades.l.map(ll),
      { renderer: pintorGent, color, weight: 2.5, opacity: .7, interactive: false }).addTo(mapa));
  }
  propostes.forEach((p, n) => {
    if (n === triada) return;
    capes.push(L_.polyline(p.r.coords.map((c) => [c[1], c[0]]), { color: getVar("--ruta-alt"), weight: 3, opacity: .7 }).addTo(mapa));
  });
  const p = propostes[triada];
  const linia = L_.polyline(p.r.coords.map((c) => [c[1], c[0]]), { color: getVar("--ruta"), weight: 5 }).addTo(mapa);
  capes.push(linia);
  if (p.mogut > MOGUT_M) {           // ruta a mida: on és ara la sortida (i l'arribada)
    for (const c of [p.r.coords[0], p.r.coords[p.r.coords.length - 1]]) {
      capes.push(L_.circleMarker([c[1], c[0]], { radius: 8, color: "#00996B", weight: 3, fillColor: "#fff", fillOpacity: 1 }).addTo(mapa));
    }
  }
  if (p.pujada) {
    capes.push(L_.polyline(p.r.coords.slice(p.pujada.ini, p.pujada.fi + 1).map((c) => [c[1], c[0]]),
      { color: getVar("--pujada"), weight: 8 }).addTo(mapa));
  }
  mapa.fitBounds(linia.getBounds().pad(0.08));
}

// ---------- GPX ----------
const nomRuta = (n) => `${nomSessio(S.t)}${propostes.length > 1 ? ` (${n + 1})` : ""}`;

const GPX = "application/gpx+xml";

/** Al mòbil, si el navegador diu que pot compartir el fitxer: el full de compartir del telèfon. */
const potCompartir = (file) => Boolean(navigator.canShare && navigator.canShare({ files: [file] })
  && /Android|iPhone|iPad|iPod/.test(navigator.userAgent));
const alMobil = () => potCompartir(new File([""], "ruta.gpx", { type: GPX }));

/**
 * Comparteix el fitxer (al mòbil) i, si no es pot, el descarrega. Torna "compartit", "cancel·lat" o "descarregat".
 * Chrome d'Android no deixa compartir GPX (només imatges, àudio, vídeo, PDF i text: ShareServiceImpl de Chromium):
 * share() hi falla i es descarrega. Safari (iPhone) sí que el comparteix.
 */
async function comparteix(file, nom) {
  if (potCompartir(file)) {
    try { await navigator.share({ files: [file], title: nom }); return "compartit"; }
    catch (e) { if (e.name === "AbortError") return "cancel·lat"; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return "descarregat";
}

/** El GPX de la proposta: al mòbil, al full de compartir (Garmin Connect, WorkOutDoors, OsmAnd...); si no, descarregat. */
function descarregaGpx(p, n) {
  const nom = nomRuta(n);
  const file = new File([Motor.gpx(nom, p.r.coords)], `ginga-${S.d || "ruta"}-${n + 1}.gpx`, { type: GPX });
  return comparteix(file, nom);
}

// ---------- Garmin ----------
// «Envia al Garmin»: el Worker de rutes connecta el compte de l'atleta i hi publica la ruta com a recorregut
// (worker/README.md, «Garmin»). Si l'enllaç porta l'atleta, la connexió és seva i el Worker la troba amb l'enllaç
// (qualsevol setmana, qualsevol aparell); si no (l'entrenador), amb la sessió que es guarda en aquest navegador. Si
// cal connectar, la ruta es desa a sessionStorage i s'envia en tornar de Garmin, perquè les propostes no tornin a
// gastar una cerca.
const GARMIN = "ginga-garmin", GARMIN_PENDENT = "ginga-garmin-pendent";
const TIPUS_GARMIN = { "foot-walking": "RUNNING", "foot-hiking": "TRAIL_RUNNING", "cycling-road": "ROAD_CYCLING",
  "cycling-regular": "GRAVEL_CYCLING", "cycling-mountain": "MOUNTAIN_BIKING" };
const signat = Boolean(lectura && lectura.sig);
const titularGarmin = () => ({ h: signat ? `${lectura.codi}.${lectura.sig}` : undefined, sessio: recupera(GARMIN) || undefined });
// connectar només es pot des d'un enllaç signat (el Worker ho comprova); enviar, també amb una sessió ja connectada
const ambGarmin = () => Boolean(PROXY && (signat || recupera(GARMIN)));
let garminConnectat = null;

function rutaGarmin(p, n) {
  return { nom: nomRuta(n), tipus: TIPUS_GARMIN[S.o] || (S.s === "ride" ? "ROAD_CYCLING" : "RUNNING"),
    punts: p.r.coords.map((c) => c.slice(0, 3).map((x) => Math.round(x * 1e6) / 1e6)) };
}

// les inicials de l'atleta (camp n de l'enllaç: Garmin no en dona el nom, i a l'enllaç no hi va cap nom)
const inicialsGarmin = () => String((S && S.n) || "").replace(/[^A-Za-zÀ-ÿ]/g, "").slice(0, 3);

/** El botó de dalt: «Garmin JR connectat», o «Connecta Garmin» si es pot connectar des d'aquí (enllaç signat).
    null: encara no se sap. */
function marcaGarmin(connectat) {
  garminConnectat = connectat;
  const b = $("b-garmin");
  b.hidden = !(connectat || (connectat === false && signat));
  b.classList.toggle("connectat", Boolean(connectat));
  b.textContent = connectat ? omple(t.garminDe, { n: inicialsGarmin() }).replace(/ {2}/, " ") : t.garminConnecta;
  $("cap-rutes").hidden = !b.hidden;
  if (!connectat) $("b-garmin-fora").hidden = true;
}

function avisGarmin(text, ambFora = false) {
  $("garmin-text").textContent = text;
  $("b-garmin-fora").hidden = !ambFora;
  $("garmin").hidden = false;
  $("garmin").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function demanaGarmin(cos) {
  const r = await fetch(PROXY, { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ ...cos, ...titularGarmin() }) });
  if (!r.ok) throw new Error(`proxy ${r.status}`);
  return r.json();
}

function connectaGarmin(ruta) {
  try {
    if (ruta) sessionStorage.setItem(GARMIN_PENDENT, JSON.stringify(ruta));
    else sessionStorage.removeItem(GARMIN_PENDENT);
  } catch (e) {}
  location.href = `${PROXY}garmin/connecta?h=${encodeURIComponent(titularGarmin().h)}`;
}

async function enviaGarmin(ruta, boto) {
  if (!ambGarmin()) return;
  const abans = boto && boto.textContent;
  if (boto) { boto.disabled = true; boto.textContent = t.garminEnviant; }
  try {
    const r = await demanaGarmin({ garmin: "envia", ruta });
    if (r.connectat === false) {            // encara no connectat, caducat o sense permís a Garmin: cal connectar-lo
      try { localStorage.removeItem(GARMIN); } catch (e) {}
      marcaGarmin(false);
      if (signat) return connectaGarmin(ruta);
      avisGarmin(t.garminError);
    } else {
      marcaGarmin(true);
      avisGarmin(r.enviat ? t.garminFet : r.error === "permis" ? t.garminPermis : t.garminError);
    }
  } catch (e) {
    avisGarmin(t.garminError);
  }
  if (boto) { boto.disabled = false; boto.textContent = abans; }
}

/** En tornar de Garmin (?garmin=ok, <sessió>, no o error): desa la sessió si n'hi ha i envia la ruta que esperava.
    true si ara se sap que està connectat (no cal preguntar-ho al Worker). */
function tornaDeGarmin() {
  const r = new URLSearchParams(location.search).get("garmin");
  if (r == null) return false;
  history.replaceState(null, "", location.pathname + location.hash);
  let pendent = null;
  try { pendent = JSON.parse(sessionStorage.getItem(GARMIN_PENDENT)); sessionStorage.removeItem(GARMIN_PENDENT); } catch (e) {}
  if (r === "no") { avisGarmin(t.garminNo); return false; }          // false: a dalt, l'estat de sempre
  if (r !== "ok" && r.length < 30) { avisGarmin(t.garminError); return false; }
  if (r !== "ok") guarda(GARMIN, r);
  marcaGarmin(true);
  if (pendent) enviaGarmin(pendent, null);
  else avisGarmin(t.garminConnectat);
  return true;
}

/** En obrir la pàgina: a dalt, si ja té Garmin connectat (i de qui) o el botó per connectar-lo. */
async function miraGarmin() {
  if (!ambGarmin()) return;
  try { marcaGarmin((await demanaGarmin({ garmin: "estat" })).connectat === true); } catch (e) { marcaGarmin(false); }
}

$("b-garmin").addEventListener("click", () => {
  if (!garminConnectat) return connectaGarmin(null);
  if (!$("garmin").hidden && !$("b-garmin-fora").hidden) { $("garmin").hidden = true; return; }   // segon toc: s'amaga
  avisGarmin(omple(t.garminEstat, { n: inicialsGarmin() }).replace(/ {2}/, " "), true);
});

$("b-garmin-fora").addEventListener("click", async () => {
  try { await demanaGarmin({ garmin: "desconnecta" }); } catch (e) {}
  try { localStorage.removeItem(GARMIN); } catch (e) {}
  marcaGarmin(false);
  avisGarmin(t.garminDesconnectat);
  if (propostes.length) pintaPropostes(S);
});

// ---------- seguiment ----------
let seg = null;
let mapaSegueix = null;       // Leaflet no deixa crear dos mapes al mateix element: es fa un cop i es reaprofita

async function segueix(p) {
  if (!navigator.geolocation) return error(t.senseGps);
  const veu = recupera("ginga-rutes-veu") !== false;
  seg = { p, i: 0, fora: 0, anunciat: {}, veu, wake: null, vigila: null, jo: null, mapa: mapaSegueix, linia: null };
  $("segueix").hidden = false;
  document.body.style.overflow = "hidden";
  $("s-atura").textContent = t.atura;
  $("s-veu").textContent = veu ? t.veuOn : t.veuOff;
  $("s-falta").textContent = "";
  $("s-gir").textContent = t.esperantGps;
  $("s-fet").textContent = omple(t.fet, { x: "0" });
  $("s-queda").textContent = omple(t.queda, { x: fmt(p.r.acc[p.r.acc.length - 1] / 1000) });
  if (!seg.mapa) {
    seg.mapa = mapaSegueix = L_.map("mapa-segueix", { zoomControl: false, attributionControl: true });
    L_.tileLayer(TESSELES, { maxZoom: 19, attribution: ATRIBUCIO }).addTo(seg.mapa);
  }
  seg.linia = L_.polyline(p.r.coords.map((c) => [c[1], c[0]]), { color: getVar("--ruta"), weight: 6 }).addTo(seg.mapa);
  seg.mapa.fitBounds(seg.linia.getBounds());
  setTimeout(() => seg && seg.mapa.invalidateSize(), 50);
  if (veu) parla(L === "en" ? "Let's go" : "Som-hi");      // a iOS, la veu s'ha d'engegar amb un toc
  await mantenEncesa();
  seg.vigila = navigator.geolocation.watchPosition(posicio, (e) => {
    if (e.code === 1) { atura(); error(t.gpsDenegat); }
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}

async function mantenEncesa() {
  try { if ("wakeLock" in navigator && seg) seg.wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (seg && document.visibilityState === "visible") mantenEncesa(); });

function parla(text) {
  if (!seg || !seg.veu || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = L === "en" ? "en-GB" : "ca-ES";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function posicio(pos) {
  if (!seg) return;
  const r = seg.p.r;
  const aqui = [pos.coords.longitude, pos.coords.latitude];
  const lloc = Motor.situa(aqui, r.coords, r.acc, seg.i);
  const total = r.acc[r.acc.length - 1];
  if (!seg.jo) seg.jo = L_.marker([aqui[1], aqui[0]], { icon: L_.divIcon({ className: "", html: '<div class="jo"></div>', iconSize: [18, 18] }) }).addTo(seg.mapa);
  seg.jo.setLatLng([aqui[1], aqui[0]]);
  seg.mapa.setView([aqui[1], aqui[0]], Math.max(seg.mapa.getZoom(), 16), { animate: true });

  // fora de la ruta: més de 40 m (més la precisió del GPS) tres lectures seguides
  const marge = 40 + Math.min(pos.coords.accuracy || 0, 30);
  seg.fora = lloc.fora > marge ? seg.fora + 1 : 0;
  $("s-fora").hidden = seg.fora < 3;
  $("s-fora").textContent = t.fora;
  if (seg.fora === 3) { parla(t.foraVeu); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
  if (seg.fora) return;

  seg.i = lloc.i;
  $("s-fet").textContent = omple(t.fet, { x: fmt(lloc.fet / 1000) });
  $("s-queda").textContent = omple(t.queda, { x: fmt(Math.max(0, total - lloc.fet) / 1000) });
  const m = Motor.properaManiobra(r.passos, r.acc, lloc.i, lloc.fet);
  if (!m) { $("s-falta").textContent = ""; $("s-gir").textContent = t.final; return; }
  const text = Motor.indicacio(m.pas, L);
  $("s-falta").textContent = m.falten < 1000 ? `${Math.max(0, Math.round(m.falten / 10) * 10)} m` : `${fmt(m.falten / 1000)} km`;
  $("s-gir").textContent = text;
  const clau = m.pas.way_points ? m.pas.way_points[0] : 0;
  if (m.falten < 200 && m.falten > 60 && !seg.anunciat[clau + "a"]) {
    seg.anunciat[clau + "a"] = true;
    parla(omple(t.enM, { m: Math.round(m.falten / 50) * 50 }) + text.charAt(0).toLowerCase() + text.slice(1));
  } else if (m.falten <= 30 && !seg.anunciat[clau + "b"]) {
    seg.anunciat[clau + "b"] = true;
    parla(text);
    if (navigator.vibrate) navigator.vibrate(150);
  }
}

function atura() {
  if (!seg) return;
  if (seg.vigila != null) navigator.geolocation.clearWatch(seg.vigila);
  if (seg.wake) seg.wake.release().catch(() => {});
  if (seg.linia) seg.linia.remove();
  if (seg.jo) seg.jo.remove();
  seg = null;
  $("segueix").hidden = true;
  document.body.style.overflow = "";
}

$("s-atura").addEventListener("click", atura);
$("s-veu").addEventListener("click", () => {
  if (!seg) return;
  seg.veu = !seg.veu;
  guarda("ginga-rutes-veu", seg.veu);
  $("s-veu").textContent = seg.veu ? t.veuOn : t.veuOff;
  if (seg.veu) parla(L === "en" ? "Voice on" : "Veu activada");
});

// ---------- engega ----------
const L_ = window.L;
capcaleraRegistre();
$("t-registre").textContent = t.registre;
$("registre-ajuda").textContent = t.registreAjuda;
$("b-reg-envia").textContent = t.registreEnvia;
$("b-reg-copia").textContent = t.registreCopia;
$("b-reg-envia").addEventListener("click", () => enviaRegistre(false));
$("b-reg-copia").addEventListener("click", () => enviaRegistre(true));
$("registre").addEventListener("toggle", pintaRegistre);
$("b-informe").textContent = t.informe;
$("b-informe").addEventListener("click", enviaInforme);
$("informe").hidden = !S;
$("t-rellotge").textContent = t.rellotge;
$("rellotges").innerHTML = t.rellotges.map((x) => `<li>${x}</li>`).join("");
$("b-garmin-fora").textContent = t.garminDesconnecta;
if (!tornaDeGarmin()) miraGarmin();
if (!S) {
  error(t.senseSessio);
} else if (S.x) {
  lectura.sig ? iniciaOberta() : error(t.senseSignatura);
} else if (Motor.caducada(S, new Date().toISOString().slice(0, 10))) {
  pintaSessio();
  error(omple(t.caducat, { d: S.d }));
} else {
  pintaSessio();
  S.f ? mostraRutaFixa() : iniciaMapa();
}
</script>
</body>
</html>
